/* ═══════════ Agent (DeepSeek) ═══════════ */
const AGENT_ACTIONS = {
  wf1_run: { label: "Lancer WF1 (articles)", run: (p) => gas("wf1_run", { sites: p.sites || [], weeks: p.weeks || [] }), gas: true },
  wf1_retry_failed: { label: "Relancer les articles en échec", run: (p) => gas("wf1_retry_failed", { sites: p.sites || [], weeks: p.weeks || [] }), gas: true },
  wf2_run: { label: "Lancer WF2a (images GPU)", run: (p) => gas("wf2_run", { sites: p.sites || [] }), gas: true },
  wf2b_run: { label: "Lancer WF2b (envoi WordPress)", run: (p) => gas("wf2b_run", { sites: p.sites || [] }), gas: true },
  wf2_retry_failed: { label: "Relancer les images en échec", run: (p) => gas("wf2_retry_failed", { sites: p.sites || [] }), gas: true },
  wf3_run: { label: "Lancer WF3a (pins)", run: (p) => gas("wf3_run", { sites: p.sites || [] }), gas: true },
  reset_failed: { label: "Tout remettre en pending", run: () => gas("reset_failed", {}), gas: true, danger: true },
  send_planned: { label: "Envoyer les pins dus maintenant", run: () => gas("send_planned", {}), gas: true },
  blotato_cancel: { label: "Annuler un post Blotato", run: (p) => fn("blotato", { action: "cancel", schedule_id: p.schedule_id }), danger: true },
  blotato_reschedule: { label: "Reprogrammer un post Blotato", run: (p) => fn("blotato", { action: "reschedule", schedule_id: p.schedule_id, scheduled_at: p.scheduled_at }) },
  resolve_alert: { label: "Résoudre une alerte", run: (p) => write(sb.from("alerts").update({ resolved_at: new Date().toISOString() }).eq("id", p.alert_id), "alerte").then(() => ({ ok: true })) },
  index_inspect: { label: "Inspecter une URL", run: (p) => fn("index-sync", { action: "inspect", url: p.url }) },
  sync_n8n: { label: "Synchroniser n8n", run: () => fn("ops-sync", { action: "run" }) },
  sync_blotato: { label: "Synchroniser Blotato", run: () => fn("blotato", { action: "sync" }) },
  refresh_pipeline: { label: "Relire le Google Sheet", run: () => fn("pipeline", { action: "refresh" }) },
};
const Agent = {
  msgs: [], busy: false, open: false,
  load() { try { this.msgs = JSON.parse(sessionStorage.getItem("agent_msgs") || "[]"); } catch (_) { this.msgs = []; } },
  save() { try { sessionStorage.setItem("agent_msgs", JSON.stringify(this.msgs.slice(-30))); } catch (_) {} },
  mount() {
    this.load();
    const fab = document.createElement("button");
    fab.className = "agent-fab"; fab.type = "button"; fab.id = "agent-fab"; fab.setAttribute("aria-label", "Ouvrir l'assistant");
    fab.innerHTML = `${icon("chat")}<span>Assistant</span>`;
    const pane = document.createElement("aside");
    pane.className = "agent"; pane.id = "agent"; pane.hidden = true; pane.setAttribute("aria-label", "Assistant");
    pane.innerHTML = `<div class="agent-h"><b>Assistant</b><span class="small muted">DeepSeek · lit tes données, propose, tu confirmes</span>
        <button class="btn sm ghost" type="button" id="agent-clear" title="Nouvelle conversation">Effacer</button>
        <button class="btn icon sm ghost" type="button" id="agent-close" aria-label="Fermer">${icon("x")}</button></div>
      <div class="agent-log" id="agent-log" aria-live="polite"></div>
      <div class="agent-sugg" id="agent-sugg"></div>
      <form class="agent-f" id="agent-form"><textarea id="agent-in" rows="2" placeholder="Ex. : quels sites n'ont rien de programmé demain ?" aria-label="Message"></textarea>
        <button class="btn primary" type="submit" id="agent-send" aria-label="Envoyer">${icon("send")}</button></form>`;
    document.body.append(fab, pane);
    fab.onclick = () => this.toggle(true);
    $("#agent-close").onclick = () => this.toggle(false);
    $("#agent-clear").onclick = () => { this.msgs = []; this.save(); this.draw(); };
    $("#agent-form").addEventListener("submit", (e) => { e.preventDefault(); this.send(); });
    $("#agent-in").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); this.send(); } });
    pane.addEventListener("click", (e) => {
      const s = e.target.closest("[data-sugg]"); if (s) { $("#agent-in").value = s.dataset.sugg; this.send(); return; }
      const x = e.target.closest("[data-agent-exec]"); if (x) this.exec(x);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && this.open && !$("#dlg").open) this.toggle(false); });
    Commands.register({ id: "agent", label: "Ouvrir l'assistant", hint: "questions sur tes données", run: () => this.toggle(true) });
    this.draw();
  },
  toggle(on) {
    this.open = on; $("#agent").hidden = !on; $("#agent-fab").hidden = on;
    if (on) setTimeout(() => $("#agent-in")?.focus(), 30);
  },
  fmt(t) {
    let h = esc(t || "");
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    h = h.split(/\n{2,}/).map((block) => {
      const lines = block.split("\n");
      if (lines.every((l) => /^\s*([-*•]|\d+\.)\s+/.test(l))) return `<ul>${lines.map((l) => `<li>${l.replace(/^\s*([-*•]|\d+\.)\s+/, "")}</li>`).join("")}</ul>`;
      if (lines.length > 1 && lines.every((l) => /^\s*\|.*\|\s*$/.test(l))) {
        const rowsT = lines.filter((l) => !/^\s*\|[\s:|-]+\|\s*$/.test(l)).map((l) => l.trim().slice(1, -1).split("|").map((c) => c.trim()));
        return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${rowsT[0].map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rowsT.slice(1).map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      }
      return `<p>${lines.join("<br>")}</p>`;
    }).join("");
    return h;
  },
  draw() {
    const log = $("#agent-log");
    log.innerHTML = this.msgs.length ? this.msgs.map((m, i) => m.role === "user"
      ? `<div class="am u">${esc(m.content)}</div>`
      : `<div class="am a">${this.fmt(m.content)}
          ${(m.proposals || []).map((p, j) => `<div class="prop"><div><b>${esc(AGENT_ACTIONS[p.action]?.label || p.action)}</b><div class="small">${esc(p.summary)}</div>${Object.keys(p.params || {}).length ? `<code class="small">${esc(JSON.stringify(p.params))}</code>` : ""}</div>
            ${p.done ? `<span class="tag">${esc(p.done)}</span>` : `<button class="btn sm primary" type="button" data-agent-exec="${i}:${j}">Exécuter</button>`}</div>`).join("")}
          ${m.steps?.length ? `<div class="steps">${m.steps.map((s) => `<span class="tag" title="${esc(JSON.stringify(s.args || {}))}">${s.ok ? "" : "⚠ "}${esc(s.tool)}</span>`).join(" ")}${m.usage ? ` <span class="muted small">${fmtFull(num(m.usage.prompt_tokens) + num(m.usage.completion_tokens))} tokens</span>` : ""}</div>` : ""}</div>`).join("")
      : `<div class="am a"><p>Pose une question sur ton système : trafic, indexation, workflows, pins, coûts… Je lis les données et je te <b>propose</b> des actions ; rien n'est exécuté sans ton clic.</p></div>`;
    if (this.busy) log.insertAdjacentHTML("beforeend", `<div class="am a busy">${lamp("run")} je regarde les données…</div>`);
    log.scrollTop = log.scrollHeight;
    $("#agent-sugg").innerHTML = this.msgs.length ? "" : ["Résume l'état du système aujourd'hui", "Quels articles ne sont pas indexés sur foodzauber ?", "Quels comptes n'ont rien de programmé demain ?", "Top 5 des pins par clics sur 30 jours", "Pourquoi WF3b a échoué cette semaine ?"]
      .map((s) => `<button type="button" class="chip" data-sugg="${esc(s)}">${esc(s)}</button>`).join("");
  },
  async send() {

  },
  async exec(btn) {

      ok: (x) => x?.message || `${A.label} : fait`,
      after: () => { Store.c.clear(); Health.load(true); Router.render({ silent: true, force: true }); },
    });
    if (r !== null) { p.done = `exécuté ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`; this.save(); this.draw(); }
  },
};

(() => {
  const init0 = Views.settings.init, load0 = Views.settings.load;

      <div>Blotato</div><div>${!blo ? `<span class="muted">${esc(r.blo.error?.message || "?")}</span>` : blo.configured ? `<div class="btn-row">${stateTag("ok", "Configuré")}<span class="small muted">synchro ${when(blo.last_sync)}</span><button class="btn sm" type="button" data-st-blotato>Synchroniser</button></div>` : `${stateTag("warn", "BLOTATO_API_KEY manquant")}<div class="hint">Blotato → Settings → API → copie la clé dans <a href="${esc(OPS_SECRETS_URL)}" target="_blank" rel="noopener">les secrets Supabase</a>.</div>`}</div>

    </div>`;
  };
