/* ═══════════ Pipeline (Google Sheet via Apps Script) ═══════════
   Socle commun : état, sélection de sites (partagée entre sous-onglets), bandeau,
   actions Apps Script et relecture après écriture. Les sous-onglets remplissent PipeTabs. */
const PipeTabs = {};
/* Actions qui déclenchent une relecture du Sheet EN ARRIÈRE-PLAN côté edge function. */
const PIPE_MUTATING = new Set(["wf1_retry_failed", "wf2_retry_failed", "reset_failed", "set_costs", "unplan_pins", "send_planned", "save_pod"]);
const Pipe = {
  row: null, data: null,
  sel: new Set((() => { try { return JSON.parse(lsGet("pipe_sel", "[]")) || []; } catch (_) { return []; } })()),
  preview: null, polling: false, again: false,
  /** Actions Apps Script en cours (clé = data-pta / data-ptb du bouton) : un re-rendu ne réactive pas leur bouton. */
  inflight: new Set(),
  /** Sites du Sheet (le site « — » = lignes sans site, masqué partout). */
  sites() {
    const d = this.data;
    const arr = (x) => (Array.isArray(x) ? x : []);
    const names = new Set([...arr(d?.articles?.bySite), ...arr(d?.images?.bySite), ...arr(d?.pins?.bySite)].map((s) => (s?.site == null ? "" : String(s.site))).filter((s) => s && s !== "—"));
    return [...names].sort((a, b) => a.localeCompare(b, "fr"));
  },
  /** Sélection courante (tableau). [] = tous les sites. */
  selected() { const all = this.sites(); return [...this.sel].filter((s) => all.includes(s)); },
  saveSel() { lsSet("pipe_sel", JSON.stringify([...this.sel])); },
  /** Puces de sélection des sites. */
  chips(id) {
    const sel = this.selected();
    return `<div class="chips" id="${id}" role="group" aria-label="Sites concernés">
      <button type="button" class="chip" data-all aria-pressed="${!sel.length}">Tous les sites</button>
      ${this.sites().map((n) => `<button type="button" class="chip" data-s="${esc(n)}" aria-pressed="${sel.includes(n)}">${esc(n)}</button>`).join("")}
    </div>`;
  },
  /** Lie les puces ; onChange est appelé après chaque changement (défaut : redessiner l'onglet). */
  bindChips(root, id, onChange) {
    const box = $(`#${id}`, root); if (!box) return;
    box.addEventListener("click", (e) => {
      const b = e.target.closest("button.chip"); if (!b) return;
      if (b.hasAttribute("data-all")) this.sel.clear();
      else { const n = b.dataset.s; this.sel.has(n) ? this.sel.delete(n) : this.sel.add(n); }
      this.saveSel();
      const sel = this.selected();
      $$("button.chip", box).forEach((c) => c.setAttribute("aria-pressed", String(c.hasAttribute("data-all") ? !sel.length : sel.includes(c.dataset.s))));
      onChange?.(sel);
    });
  },
  /** Action Apps Script : confirmation, bouton occupé, toast, puis relecture si l'action écrit dans le Sheet. */
  async gasAct(btn, action, params = {}, { confirm = null, ok = () => "Fait", fail = gasFail, bad = gasBad, after = null } = {}) {
    /* Référence taken_at relue JUSTE avant l'appel (pas celle du dernier rendu, qui peut dater). */
    let before = this.row?.taken_at || null;
    const key = btn?.dataset?.pta || btn?.dataset?.ptb || action;
    this.inflight.add(key);
    try {
      return await act(btn, {
        confirm,
        run: async () => {
          try { before = (await Data.pipelineMeta({ force: true }))?.taken_at || before; } catch (_) {}
          return gas(action, params);
        },
        bad, fail, ok,
        after: async (r, isBad) => {
          if (!isBad && (PIPE_MUTATING.has(action) || (action === "plan_pins" && String(params.dry) === "0"))) this.waitRefresh(before);
          if (after) await after(r, isBad, before);
        },
      });
    } finally {
      this.inflight.delete(key);
      $$(`[data-pta="${CSS.escape(key)}"],[data-ptb="${CSS.escape(key)}"]`).forEach((b) => busy(b, false));
    }
  },
  /** L'edge function relit le Sheet en arrière-plan : on surveille taken_at puis on recharge. */
  async waitRefresh(before) {
    if (this.polling) { this.again = true; return; }
    this.polling = true;
    const note = $("#pipe-wait");
    if (note) { note.hidden = false; note.innerHTML = `${lamp("run")}Le Sheet se relit en arrière-plan (10 à 60 s) : les chiffres se mettront à jour seuls.`; }
    let t0 = Date.now();
    try {
      while (Date.now() - t0 < 120_000) {
        await new Promise((res) => setTimeout(res, 8000));
        let m = null;
        try { m = await Data.pipelineMeta({ force: true }); } catch (_) { continue; }
        if (m && m.taken_at && m.taken_at !== before) {
          Store.drop("pipeline_state");

/** Calendrier : ce qu'a produit le pipeline le jour / la période choisi(e).

  Period.paint(el, P);

  const days = Array.isArray(d?.days) ? d.days.map((k) => String(k).slice(0, 10)) : [];
  const idx = days.map((k, i) => (k >= P.from && k <= P.to ? i : -1)).filter((i) => i >= 0);
  const pick = (arr) => (Array.isArray(arr) ? idx.reduce((a, i) => a + num(arr[i]), 0) : null);
  const costRows = (Array.isArray(d?.cost?.daily) ? d.cost.daily : []).filter((x) => x && String(x.d).slice(0, 10) >= P.from && String(x.d).slice(0, 10) <= P.to);
  const inSheet = idx.length > 0;

  if (!ctx.alive()) return;

  const g = (m, a, b) => numOrNull(m?.[a]?.[b]);
  const first = H.length ? H[0].first_metrics : null, last = H.length ? H[H.length - 1].last_metrics : null;
  const dlt = (a, b) => (first && last && g(last, a, b) != null && g(first, a, b) != null ? g(last, a, b) - g(first, a, b) : null);
  const dP = (k) => (first && last ? num(last?.pins?.[k]) - num(first?.pins?.[k]) : null);

    body: `<div style="padding:12px 14px">${kpis([
      kpi({ label: "Articles générés", value: inSheet ? v(pick(d?.articles?.daily)) : "—", sub: "WF1 (série du Sheet)" }),
      kpi({ label: "Articles publiés", value: v(dlt("articles", "published")), sub: H.length ? `écart des relevés (${fmtFull(sum(H, "snapshots"))})` : herr ? "relevés illisibles" : "aucun relevé ce jour-là" }),
      kpi({ label: "Images", value: inSheet ? v(pick(d?.images?.dailyImgs ?? d?.images?.daily)) : "—", sub: "WF2 (série du Sheet)" }),
      kpi({ label: "Pins générés", value: inSheet ? v(pick(d?.pins?.daily)) : "—", sub: "WF3a (série du Sheet)" }),
      kpi({ label: "Pins programmés / postés", value: H.length ? v(num(dP("scheduled")) + num(dP("posted"))) : "—", sub: "écart des relevés" }),
      kpi({ label: "Coût", value: costRows.length ? mad(cost) : "—", sub: costRows.length ? "articles + images + pins" : "pas dans la série du Sheet" }),
    ])}${herr ? `<p class="hint t-crit">${esc(herr.message || herr)}</p>` : ""}<p class="hint">Les compteurs « publiés » et « programmés » viennent de la différence entre le relevé du Sheet de la veille au soir et celui du soir du jour (un relevé par heure depuis le 25/10).</p></div>` });
}

const ptaStr = (v) => (v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v));
const ptaNorm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss").toLowerCase();

/** Somme d'une colonne d'un bySite limitée à la sélection ([] = total du Sheet). */

/** Articles en échec visés par « Relancer les échecs » (sites × semaines, au mieux de ce que le Sheet donne). */
function ptaRetryScope(A, sel, weeks) {

/** Instant (ms) si la valeur ressemble à une date, sinon null. */
function ptaTime(v) {
  if (typeof v === "number") return v > 1e11 && v < 8.64e15 ? v : null; // au-delà, new Date() est invalide
  const s = ptaStr(v).trim();

/* ─── Rendu : montage, délégation, tris, focus ─── */
function ptaSaveSorts(scope) { $$("[data-pta-tbl]", scope).forEach((b) => { if (b.id && b._tbl?.sort) PTA.sorts[b.id] = b._tbl.sort; }); }
function ptaTable(root, id, spec) {

}
/** Garde le champ en cours de saisie (et son curseur) à travers une réécriture du corps. */
function ptaFocusSnap(el) {
  const a = document.activeElement;
  if (!a || !a.id || !el.contains(a) || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return () => {};
  const id = a.id; let s = null, e = null;
  try { s = a.selectionStart; e = a.selectionEnd; } catch (_) {}
  return () => {
    const n = document.getElementById(id); if (!n) return;
    n.focus({ preventScroll: true });
    try { if (s != null) n.setSelectionRange(s, e); } catch (_) {}
  };
}
/** Défilement des tableaux et graphiques basculés en « Tableau », pour les reposer après réécriture. */
function ptaViewSnap(el) {
  const old = el.querySelector("[data-pta-tab]");
  if (!old) return { tab: null, scroll: {}, tv: [] };
  const scroll = {};
  $$("[data-pta-tbl]", old).forEach((b) => { const w = $(".tbl-wrap", b); if (b.id && w && (w.scrollTop || w.scrollLeft)) scroll[b.id] = [w.scrollTop, w.scrollLeft]; });
  const tv = $$('[data-chart-table][aria-pressed="true"]', old).map((b) => b.dataset.chartTable);
  return { tab: old.dataset.ptaTab, scroll, tv };
}
/** Réécrit le corps de l'onglet ; renvoie la nouvelle racine (les événements se lient dessus). */
function ptaMount(el, tab, html) {
  ptaSaveSorts(el);
  const restore = ptaFocusSnap(el);
  const view = ptaViewSnap(el);
  el.innerHTML = `<div class="stack" data-pta-tab="${tab}">${html}</div>`;
  const root = el.firstElementChild;
  root._ptaRestore = restore;
  root._ptaView = view.tab === tab ? view : null; // même onglet relu : on garde défilement et vues tableau
  return root;
}
/** Délégation sur la racine : data-pta="<action>" → handlers[action](bouton, root). */
function ptaOn(root, handlers) {
  root.addEventListener("click", (e) => {
    const b = e.target.closest("[data-pta]");
    if (b && root.contains(b)) {
      const k = b.dataset.pta;
      const h = handlers[k] || (k === "refresh" ? () => $("#pipe-refresh")?.click() : null);
      if (h) { e.preventDefault(); h(b, root); }
    }
    ptaSaveSorts(root);
  });
}
function ptaDone(root, pendingKey) {
  root._ptaRestore?.();
  const v = root._ptaView;
  if (v) {
    v.tv.forEach((id) => { const b = $(`[data-chart-table="${CSS.escape(id)}"]`, root); if (b && b.getAttribute("aria-pressed") !== "true") b.click(); });
    Object.entries(v.scroll).forEach(([id, [t, l]]) => { const w = $(`#${CSS.escape(id)} .tbl-wrap`, root); if (w) { w.scrollTop = t; w.scrollLeft = l; } });
  }
  const p = PTA.pending;
  if (!pendingKey || !p || p.key !== pendingKey) return;
  PTA.pending = null;
  if (Date.now() - p.t > 60_000) return;
  setTimeout(() => { if (root.isConnected) $(`[data-pta="${pendingKey}"]`, root)?.click(); }, 0);
}

PipeTabs.synth = {
  render(d, el) {

/** « 3, 4 », « 3;4 », « S3 S4 » → [3, 4]. Tout jeton qui n'est pas une semaine 1-53 est refusé. */
function ptaParseWeeks(raw) {
  const s = String(raw ?? "").trim().replace(/(^|[,;\s])[sS]\s+(?=\d)/g, "$1S");
  const weeks = [], bad = [];
  if (!s) return { weeks, bad };
  const tokens = s.split(/[,;\s]+/).filter(Boolean);
  if (!tokens.length) return { weeks, bad: [s] }; // que des séparateurs : pas « toutes » en silence
  for (const t of tokens) {
    const m = /^[sS]?(\d{1,2})$/.exec(t), n = m ? Number(m[1]) : NaN;
    if (n >= 1 && n <= 53) { if (!weeks.includes(n)) weeks.push(n); } else bad.push(t);
  }
  weeks.sort((a, b) => a - b);
  return { weeks, bad };
}
function ptaWeeksCheck(root) {
  const inp = $("#pta-weeks", root), msg = $("#pta-weeks-msg", root);
  const p = ptaParseWeeks(inp ? inp.value : PTA.weeks);
  if (inp) { if (p.bad.length) inp.setAttribute("aria-invalid", "true"); else inp.removeAttribute("aria-invalid"); }
  if (msg) msg.innerHTML = p.bad.length
    ? `${lamp("crit")} <span class="t-crit">${esc(p.bad.slice(0, 3).map((t) => `« ${t} »`).join(", "))}${p.bad.length > 3 ? "…" : ""} : ${p.bad.length > 1 ? "ce ne sont pas des numéros" : "ce n'est pas un numéro"} de semaine. Écris des nombres de 1 à 53 séparés par une virgule, un point-virgule ou une espace (ex. 3, 4 ou S3 S4).</span>`
    : p.weeks.length ? `Semaines retenues : <b>${esc(p.weeks.join(", "))}</b>` : "Vide = toutes les semaines du plan.";
  return p;
}
/** Semaines valides, ou null (erreur affichée sous le champ, lancement bloqué). */
function ptaWeeksOrStop(root) {
  const p = ptaWeeksCheck(root);
  if (p.bad.length) { $("#pta-weeks", root)?.focus(); return null; }
  return p.weeks;
}
/** Sortie du diagnostic (gardée dans PTA.diag, redessinée à chaque rendu). */
function ptaDrawDiag() {
  const out = document.getElementById("pta-diag-out"); if (!out) return;
  const st = PTA.diag;
  if (!st) { out.innerHTML = ""; return; }
  const r = ptaObj(st.r);
  const head = `<div class="btn-row"><span class="section-title">Diagnostic WF1 · ${when(st.at)}</span><span class="spacer"></span><button class="btn sm ghost" type="button" data-pta="diag-close">Fermer</button></div>`;
  if (st.bad) { out.innerHTML = head + errBox(new Error(gasFail(st.r)), { retry: false }); return; }
  const groups = ptaRows(r.error_groups).map((g) => ({ error: ptaStr(g.error), count: num(g.count), examples: ptaArr(g.examples).map(ptaExample).filter(Boolean) }));
  out.innerHTML = `${head}
    ${ptaStr(r.recommendation).trim() ? `<p style="margin-top:8px"><b>${esc(ptaStr(r.recommendation).trim())}</b></p>` : ""}
    <p class="hint">${fmt(num(r.failed))} en échec · ${fmt(num(r.processing))} bloqués en processing</p>
    <div class="out" id="pta-diag-tbl" data-pta-tbl></div>`;
  ptaTable(out, "pta-diag-tbl", {
    rows: groups, sort: { key: "count", dir: "desc" }, csvName: "wf1-diagnostic",
    empty: emptyBox("Aucun groupe d'erreurs", "WF1 n'a remonté aucune erreur regroupable."),
    cols: [
      { key: "error", label: "Erreur", cls: "wrap", render: (g) => (g.error ? `<span class="small">${esc(g.error)}</span>` : `<span class="muted">—</span>`) },
      { key: "count", label: "Nb", r: 1, num: 1, render: (g) => fmt(g.count) },
      { key: "examples", label: "Exemples", sort: false, cls: "wrap", csv: (g) => g.examples.join(" | "),
        render: (g) => (g.examples.length ? `<span class="small muted">${g.examples.slice(0, 5).map(esc).join("<br>")}${g.examples.length > 5 ? `<br>+ ${fmtFull(g.examples.length - 5)}` : ""}</span>` : `<span class="muted">—</span>`) },

}

/** URL du pod : celle du Sheet, ou celle qu'on vient d'enregistrer tant que le Sheet n'a pas été relu. */
function ptaPod(d) {
  const pod = ptaObj(d.pod);
  let url = ptaStr(pod.url).trim(), at = pod.updated_at || null;
  const s = PTA.podSaved;
  if (s) {
    // Sheet relu avec succès depuis l'enregistrement (taken_at a changé : pas de comparaison d'horloges
    // client / serveur), ou 10 min passées : le Sheet fait foi.
    const reread = Pipe.row?.ok && (!s.before || Date.parse(Pipe.row.taken_at) > Date.parse(s.before));
    if (reread || Date.now() - s.at > 10 * 60_000) PTA.podSaved = null;
    else { url = s.url; at = new Date(s.at).toISOString(); }
  }
  return { url, at };
}
function ptaPodErr(u) {
  if (!u) return "Colle l'URL du pod (ex. https://xxxx-8000.proxy.runpod.net).";
  if (!/^https?:\/\//i.test(u)) return "L'URL doit commencer par https://";
  try { const x = new URL(u); if (!x.hostname || /\s/.test(u)) throw new Error("url"); } catch (_) { return "URL invalide : vérifie qu'elle est complète."; }
  return "";
}
function ptaPodMsg(root, saved, err = "") {
  const m = $("#pta-pod-msg", root); if (!m) return;
  m.innerHTML = err ? `${lamp("crit")} <span class="t-crit">${esc(err)}</span>`
    : PTA.podDraft != null ? `${lamp("warn")} Modifiée, pas encore enregistrée${saved ? ` · enregistrée : <code>${esc(saved)}</code>` : ""}.`
    : saved ? "" : `${lamp("warn")} Aucune URL enregistrée : WF2a ne peut pas joindre le GPU.`;
}
function ptaDrawPodTest() {
  const out = document.getElementById("pta-pod-out"); if (!out) return;
  const st = PTA.podTest;
  if (!st) { out.innerHTML = ""; return; }
  const r = ptaObj(st.r), tests = ptaRows(r.tests);
  const tested = ptaStr(r.pod_url).trim() || st.saved;
  const differs = st.typed && tested && ptaUrlKey(st.typed) !== ptaUrlKey(tested);
  out.innerHTML = `<div class="btn-row"><span class="section-title">Test du pod · ${when(st.at)}</span><span class="spacer"></span><button class="btn sm ghost" type="button" data-pta="podtest-close">Fermer</button></div>
    ${tested ? `<p class="hint">URL testée : <code>${esc(tested)}</code></p>` : ""}
    ${differs ? `<p class="hint">${lamp("warn")} Le test porte sur l'URL enregistrée, pas sur celle saisie : clique « Enregistrer », puis reteste.</p>` : ""}

/* ═══════════ Pipeline · Pinterest, Planificateur, Coûts ═══════════
   Remplit PipeTabs.pins / planner / costs (socle : views/pipeline.js).
   Chaque onglet pose sa structure UNE fois (racine data-ptb-root), puis chaque lecture
   remplit ses blocs un par un : un rechargement silencieux ne touche ni une saisie en
   cours, ni le tri des tableaux, ni l'aperçu du planificateur, ni la vue tableau du graphique.
   Les actions passent par une délégation unique (data-ptb) posée sur la section Pipeline. */
const PTB_TZ = ["Europe/Berlin", "Europe/Paris", "Africa/Casablanca"];
/* Champs numériques du planificateur : clé interne, clé localStorage (mêmes que la v3), bornes. */
const PTB_FIELDS = [
  { k: "days", ls: "plan_days", def: "7", min: 1, max: 60, err: "Nombre de jours : nombre entier de 1 à 60." },
  { k: "per", ls: "plan_per", def: "3", min: 1, max: 25, err: "Pins / jour / compte : nombre entier de 1 à 25." },
  { k: "h1", ls: "plan_h1", def: "7", min: 0, max: 23, err: "Heure de début : nombre entier de 0 à 23." },
  { k: "h2", ls: "plan_h2", def: "22", min: 1, max: 24, err: "Heure de fin : nombre entier de 1 à 24." },
  { k: "gap", ls: "plan_gap", def: "30", min: 5, max: null, err: "Écart minimum : nombre entier de minutes, 5 au moins." },
  { k: "avoid", ls: "plan_avoid", def: "2", min: 0, max: 30, err: "Éviter le même article : nombre entier de 0 à 30 jours." },
];
const PTB_COSTS = [["article", "Article", "article"], ["image", "Image", "image"], ["pin", "Pin", "pin"]];
const PTB_NEXT_READ = "les chiffres bougeront à la prochaine lecture du Sheet (15 min) ou via « Actualiser »";
const PTB = {
  plan: {
    vals: null,      // valeurs du formulaire (miroir des champs, survit aux rechargements)
    out: null,       // {kind:'preview'|'applied', result, opts, seed, at, stale:false|'options'|'unplan', fromPreview}
    valid: true,
    auto: null,      // dernière réponse auto_* ({on, last}) ou {error}
    autoSeq: 0, autoBusy: 0,
    previewSeq: 0,   // numéro du dernier aperçu lancé : une réponse plus ancienne est ignorée
  },
  cost: { edit: {}, saved: null }, // edit : saisies non enregistrées ; saved : {t} = taken_at avant l'enregistrement
  pending: null,   // {tab, action, t} : action lancée depuis la palette, jouée au prochain rendu
};

/* ─── Petits outils (données du Sheet : types non garantis) ─── */
const ptbArr = (x) => (Array.isArray(x) ? x : []);
const ptbObj = (x) => (x && typeof x === "object" && !Array.isArray(x) ? x : {});
const ptbIsDay = (k) => k != null && /^\d{4}-\d{2}-\d{2}/.test(String(k)) && !isNaN(dayDate(k).getTime());
/** 'YYYY-MM-DD' formaté, ou la valeur brute si ce n'est pas une date (texte à échapper). */
const ptbDay = (k, f = fmtDay) => (ptbIsDay(k) ? f(String(k).slice(0, 10)) : String(k ?? "—"));
const ptbInt = (v) => { const s = String(v ?? "").trim(); return /^\d{1,6}$/.test(s) ? parseInt(s, 10) : null; };
const ptbCostNum = (v) => { if (v == null || String(v).trim() === "") return null; const n = Number(String(v).trim().replace(",", ".")); return Number.isFinite(n) ? n : null; };
const ptbNumStr = (v) => { const n = ptbCostNum(v); return n == null ? "" : String(n); };
const ptbOn = (r) => r?.on === true || r?.on === 1 || r?.on === "true" || r?.on === "1";
/** Texte d'une cellule venant du Sheet (un objet ne s'affiche jamais « [object Object] »). */
const ptbStr = (v) => (v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v));
/** Aujourd'hui selon le Sheet (d.today), sinon le premier des 14 prochains jours, sinon UTC. */
const ptbToday = (d) => (ptbIsDay(d?.today) ? String(d.today).slice(0, 10) : ptbIsDay(ptbArr(d?.nextDays)[0]) ? String(d.nextDays[0]).slice(0, 10) : daysAgo(0));
/** Premier jour par défaut : demain selon le Sheet. */
const ptbDefaultStart = (d) => (ptbIsDay(ptbArr(d?.nextDays)[1]) ? String(d.nextDays[1]).slice(0, 10) : ptbIsDay(d?.today) ? addDays(String(d.today).slice(0, 10), 1) : daysAgo(-1));
const ptbMad = (n, prec = false) => { const t = prec ? madPrec(n) : mad(n); return t.endsWith(" MAD") ? `${t.slice(0, -4)}<small> MAD</small>` : t; };
const ptbRefreshBtn = () => `<button class="btn" type="button" data-ptb="refresh">${icon("sync")}Actualiser depuis le Sheet</button>`;
const ptbGo = (tab, txt, cls = "") => `<a${cls ? ` class="${cls}"` : ""} href="${Router.href("pipeline", { tab })}" data-nav="pipeline" data-tab="${tab}">${esc(txt)}</a>`;
const ptbPlural = (n, one, many) => `${fmtFull(n)} ${Math.abs(num(n)) > 1 ? many : one}`;

/* ─── Montage, blocs, délégation ─── */
/** Pose la structure de l'onglet si elle n'est pas déjà là ; renvoie la racine (root._fresh = vient d'être posée). */
function ptbMount(el, name, html) {
  let root = el.firstElementChild;
  if (!root || el.children.length !== 1 || root.dataset.ptbRoot !== name) {
    el.innerHTML = `<div class="stack" data-ptb-root="${name}">${html()}</div>`;
    root = el.firstElementChild;
    root._fresh = true;
  } else root._fresh = false;
  return root;
}
/** Remplit un bloc ; une donnée inattendue n'efface que ce bloc (état d'erreur + Réessayer). */
function ptbBlock(box, fill) {
  if (!box) return;
  try { fill(box); } catch (e) { console.error(e); box.innerHTML = errBox(new Error(`Affichage impossible : ${e.message}. Les données du Sheet ont peut-être changé de forme.`)); }
}
/** Puces de sites partagées (Pipe.sel) ; redessinées seulement si la liste ou la sélection a changé. */
function ptbChips(root, slot, id, onChange) {
  const box = $(`[data-ptb-chips="${slot}"]`, root);
  if (!box) return;
  const sites = Pipe.sites(), sig = JSON.stringify([sites, Pipe.selected()]);
  if (box.dataset.sig === sig && box.firstElementChild) return;
  box.dataset.sig = sig;
  if (!sites.length) { box.innerHTML = `<p class="small muted">Aucun site dans le Sheet : l'action portera sur tous les sites.</p>`; return; }
  box.innerHTML = Pipe.chips(id);
  Pipe.bindChips(box, id, (sel) => { box.dataset.sig = JSON.stringify([Pipe.sites(), sel]); onChange?.(sel); });
}
/** Délégation unique sur la section : clic data-ptb="<action>", saisie dans form[data-ptb-form]. */
function ptbBind(host) {
  if (!host || host._ptbBound) return;
  host._ptbBound = true;
  host.addEventListener("click", (e) => {
    const b = e.target.closest?.("[data-ptb]");
    if (!b || !host.contains(b)) return;
    const run = PTB_ACTIONS[b.dataset.ptb];
    if (!run) return;
    e.preventDefault();
    Promise.resolve().then(() => run(b)).catch((err) => { console.error(err); toast(err?.message || String(err), { err: true }); });
  });
  const onField = (e) => {
    const t = e.target, f = t?.closest?.("form[data-ptb-form]");
    if (!f || !t.dataset?.k) return;
    if (f.dataset.ptbForm === "plan") ptbPlanField(t);
    else if (f.dataset.ptbForm === "cost") ptbCostField(t);
  };
  host.addEventListener("input", onField);
  host.addEventListener("change", onField);
  host.addEventListener("submit", (e) => { if (e.target.closest?.("form[data-ptb-form]")) e.preventDefault(); });
}
/** Action demandée depuis la palette : ouvre l'onglet puis clique le bouton (qui demande confirmation). */
function ptbQueue(tab, action) {
  PTB.pending = { tab, action, t: Date.now() };
  const root = document.querySelector(`[data-ptb-root="${tab}"]`);
  if (Router.view === "pipeline" && Router.params.tab === tab && root) ptbRunPending(root, tab);
  else Router.go("pipeline", { tab });
}
function ptbRunPending(root, tab) {
  const p = PTB.pending;
  if (!p || p.tab !== tab) return;

/** Calendrier heatmap : sites × 14 prochains jours (programmés + planifiés). 0 = signal d'alerte. */
function ptbCal(d, accounts) {
  const cal = ptbObj(ptbObj(d.pins).cal);
  const days = ptbArr(d.nextDays).filter(ptbIsDay).map((k) => String(k).slice(0, 10));
  const sites = [...new Set(accounts.map((s) => String(s.site)))].sort((a, b) => a.localeCompare(b, "fr"));
  if (!days.length) return { html: emptyBox("Pas de calendrier dans la lecture du Sheet", "La liste des 14 prochains jours (nextDays) manque. Relis le Sheet ; si elle manque encore, vérifie Dashboard.gs.", ptbRefreshBtn()), gap: "" };
  if (!sites.length) return { html: emptyBox("Aucun compte Pinterest à afficher", "Relie un compte Pinterest à chaque site dans l'onglet Sites du Sheet, génère des pins (WF3a) puis planifie-les.", ptbGo("planner", "Ouvrir le Planificateur", "btn")), gap: "" };
  const cell = (s, k) => num(ptbObj(cal[s])[k]);
  const max = Math.max(1, ...sites.flatMap((s) => days.map((k) => cell(s, k))));
  const today = ptbIsDay(d.today) ? String(d.today).slice(0, 10) : null;
  const isWe = (k) => { const w = dayDate(k).getUTCDay(); return w === 0 || w === 6; };
  const head = `<tr><th class="first" scope="col">Site</th>${days.map((k) => {
    const [a, ...b] = fmtDayW(k).split(" ");
    const t = `${fmtDayLong(k)}${k === today ? " (aujourd'hui)" : ""}${isWe(k) ? " · week-end" : ""}`;
    return `<th class="c${isWe(k) ? " we" : ""}" scope="col" title="${esc(t)}"${k === today ? ` aria-current="date"` : ""}>${esc(a)}<br>${esc(b.join(" "))}</th>`;
  }).join("")}<th class="r last" scope="col">${days.length} j</th></tr>`;
  let grand = 0;
  const body = sites.map((s) => {
    let tot = 0;
    const tds = days.map((k) => {
      const n = cell(s, k), we = isWe(k) ? " we" : "";
      tot += n;
      const t = `${s} · ${fmtDayLong(k)} : ${n} pin(s)`;
      if (!n) return `<td class="c zero${we}" title="${esc(t)}">0</td>`;
      const x = Math.round(14 + (56 * n) / max);
      return `<td class="c${we}" style="background:color-mix(in srgb, var(--series-1) ${x}%, var(--surface))" title="${esc(t)}">${fmtFull(n)}</td>`;
    }).join("");
    grand += tot;
    return `<tr><td class="first"><span class="cell-main">${esc(s)}</span></td>${tds}<td class="r num last${tot ? "" : " hot"}">${tot ? `<b>${fmtFull(tot)}</b>` : "0"}</td></tr>`;
  }).join("");
  const foot = sites.length > 1 ? `<tr><td class="first">Total</td>${days.map((k) => { const n = sites.reduce((a, s) => a + cell(s, k), 0); return `<td class="c${n ? "" : " zero"}">${fmtFull(n)}</td>`; }).join("")}<td class="r num last">${fmtFull(grand)}</td></tr>` : "";
  const html = `<div class="tbl-wrap"><table class="tbl cal"><caption class="sr-only">Pins programmés et planifiés par site pour les ${days.length} prochains jours. 0 = aucun pin ce jour-là.</caption><thead>${head}</thead><tbody>${body}</tbody>${foot ? `<tfoot>${foot}</tfoot>` : ""}</table></div>`;
  /* Bandeau : sites sans aucun pin sur les 48 prochaines heures (les 2 premiers jours). */
  const near = days.slice(0, 2);
  const gaps = sites.filter((s) => near.every((k) => !cell(s, k)));
  const gap = gaps.length ? `<div class="banner warn" role="status"><div class="t"><b>${esc(ptbPlural(gaps.length, "site sans pin", "sites sans pin"))} dans les 48 h</b>
      <span class="small">${esc(gaps.join(", "))} : rien de programmé ni de planifié ${near.length === 2 ? `le ${esc(fmtDayW(near[0]))} ni le ${esc(fmtDayW(near[1]))}` : `le ${esc(fmtDayW(near[0]))}`}</span></div>
      ${ptbGo("planner", "Planifier", "btn sm")}</div>` : "";
  return { html, gap };
}

function ptbPlanSync() {
  const p = Pipe.preview, P = PTB.plan;
  $$('[data-ptb="plan-apply"]').forEach((b) => {
    if (b.getAttribute("aria-busy") === "true") return;
    b.disabled = !(p && p.seed);
    b.title = !p ? "Lance d'abord un aperçu" : !p.seed ? "Aperçu sans seed : relance l'aperçu" : "Écrit exactement cet aperçu dans le Sheet";
  });
  $$('[data-ptb="plan-preview"]').forEach((b) => {
    if (b.getAttribute("aria-busy") === "true") return;
    b.disabled = P.valid === false;
    b.title = P.valid === false ? "Corrige d'abord les options en rouge" : "Calcule le planning sans rien écrire";
  });
  const st = document.getElementById("ptb-pl-state");
  if (st) {
    const o = P.out;
    st.innerHTML = p && p.seed ? `<span class="t-good">Aperçu prêt · ${esc(ptbPlural(ptbPlanTotal(p.result), "pin", "pins"))}</span>`
      : p ? `<span class="t-crit">Aperçu sans seed : relance-le</span>`
      : o && o.kind === "preview" && o.stale ? `<span class="t-warn">Aperçu périmé : relance l'aperçu</span>`
      : o && o.kind === "applied" && !o.stale ? `<span class="t-good">Plan écrit dans le Sheet · relance un aperçu pour en ajouter</span>`
      : `<span class="muted">Rien n'est écrit avant « Appliquer ».</span>`;
  }
}
/** Bloc de sortie : aperçu, plan appliqué, ou aperçu périmé (grisé, avec le motif). */
function ptbPlanPaintOut() {
  const box = document.getElementById("ptb-plan-out");
  if (!box) return;
  ptbBlock(box, () => {
    const P = PTB.plan, p = Pipe.preview;
    const o = P.out || (p ? { kind: "preview", result: p.result, opts: p.opts, seed: p.seed, at: null, stale: false } : null);
    if (!o) {
      box.innerHTML = panel({ title: "Aperçu", body: emptyBox("Pas encore d'aperçu", "Règle les options puis clique « Aperçu » : le planning est calculé sans rien écrire. « Appliquer cet aperçu » écrit ensuite exactement ce tirage dans le Sheet.", `<button class="btn" type="button" data-ptb="plan-preview">Lancer l'aperçu</button>`) });
      return;
    }
    const r = ptbObj(o.result), applied = o.kind === "applied";
    const perSite = realSites(ptbArr(r.perSite).filter((s) => s && typeof s === "object"));
    let days = ptbArr(r.days).map(String);
    if (!days.length) days = [...new Set(perSite.flatMap((s) => [...Object.keys(ptbObj(s.days)), ...Object.keys(ptbObj(s.exist))]))].sort();
    const total = ptbPlanTotal(r);
    const title = applied ? `Plan appliqué · ${fmtFull(r.written != null ? num(r.written) : total)} pins écrits` : `Aperçu · ${fmtFull(total)} pins`;
    const m = ptbObj(o.opts);
    const bits = [sitesLabel(ptbArr(m.sites)), m.start ? `dès le ${ptbDay(m.start)}` : "", m.days ? `${m.days} j` : "", m.per_day ? `${m.per_day} / jour / compte` : "",
      m.h_start != null && m.h_end != null ? `${m.h_start} h → ${m.h_end} h` : "", m.tz || ""].filter(Boolean).map(esc);
    const seed = o.seed || (r.options?.seed != null ? String(r.options.seed) : "");
    const meta = bits.join(" · ") + (seed ? ` · seed <code>${esc(seed)}</code>` : "") + (o.at ? ` · ${applied ? "écrit" : "calculé"} ${when(new Date(o.at).toISOString())}` : "");

    let banner = "";
    if (o.stale && applied) banner = `<div class="banner warn" role="status"><div class="t"><b>Plan modifié depuis</b><span class="small">« Déplanifier » a effacé des planifications après l'application de ce plan : le Sheet ne correspond plus à ce tableau.</span></div><button class="btn sm" type="button" data-ptb="plan-preview">Nouvel aperçu</button></div>`;
    else if (o.stale) banner = `<div class="banner warn" role="status"><div class="t"><b>Aperçu périmé — relance l'aperçu</b><span class="small">${o.stale === "unplan" ? "Des planifications ont été effacées depuis ce calcul." : "Une option ou la sélection de sites a changé depuis ce calcul."} « Appliquer cet aperçu » reste désactivé jusqu'au prochain aperçu.</span></div><button class="btn sm" type="button" data-ptb="plan-preview">Relancer l'aperçu</button></div>`;
    else if (!applied && p && !p.seed) banner = `<div class="banner crit" role="alert"><div class="t"><b>Aperçu sans seed</b><span class="small">Apps Script n'a pas renvoyé <code>options.seed</code> : appliquer donnerait un autre tirage que celui affiché, donc « Appliquer » reste coupé. Relance l'aperçu ; si ça se répète, vérifie API.gs.</span></div></div>`;

    const msgs = [];
    const short = ptbArr(r.shortage).filter((x) => x && typeof x === "object");
    if (short.length) msgs.push(`<div class="small t-crit">${lamp("crit")} Pas assez de pins pour ${fmtFull(short.length)} jour(s)/compte : ${esc(short.slice(0, 6).map((x) => `${ptbStr(x.site) || "?"} ${ptbDay(x.day)} (−${fmtFull(num(x.missing))})`).join(", "))}${short.length > 6 ? "…" : ""}
      <div class="hint">Génère d'autres pins avec WF3a (onglet ${ptbGo("pins", "Pinterest")}), ou baisse « Pins / jour / compte ».</div></div>`);
    const sk = ptbObj(r.skipped);
    if (num(sk.noAccount) + num(sk.noBoard) + num(sk.noImage)) msgs.push(`<div class="small muted">Ignorés : ${fmtFull(num(sk.noAccount))} sans compte, ${fmtFull(num(sk.noBoard))} sans board, ${fmtFull(num(sk.noImage))} sans image.</div>`);
    if (o.fromPreview) msgs.push(`<div class="small muted">Détail par jour repris de l'aperçu : Apps Script n'a renvoyé que le nombre de pins écrits.</div>`);

    /* Le bloc est réécrit à chaque rendu : on garde le tri choisi par l'utilisateur. */
    const prevSort = $("#ptb-plan-tbl", box)?._tbl?.sort || null;
    box.innerHTML = banner + panel({ title, meta, tools: perSite.length ? csvBtn("ptb-plan-tbl") : "", cls: o.stale ? "is-stale" : "", flush: true,
      body: `${msgs.length ? `<div class="panel-b stack">${msgs.join("")}</div>` : ""}<div id="ptb-plan-tbl"></div>`,
      note: perSite.length ? "« n+ » = pins déjà programmés ce jour-là avant cet ajout." : "" });

    const n = (s, k) => [num(ptbObj(s.exist)[k]), num(ptbObj(s.days)[k])];
    const sortKeys = new Set(["site", "account", "planned", "waiting", ...days.map((k) => "d:" + k)]);
    mountTable($("#ptb-plan-tbl", box), {
      id: "ptb-plan-tbl", csvName: applied ? "plan-pins-applique" : "apercu-plan-pins", rows: perSite,
      sort: prevSort && sortKeys.has(prevSort.key) ? prevSort : { key: "site", dir: "asc" },
      empty: emptyBox(applied ? "Aucun pin écrit" : "Aucun pin à planifier",
        applied ? "Apps Script n'a écrit aucun pin pour cette sélection." : "Aucun pin « en attente » (généré, sans date) sur cette sélection et cette période. Génère des pins avec WF3a, puis relance l'aperçu.",
        ptbGo("pins", "Ouvrir Pinterest", "btn")),
      cols: [
        { key: "site", label: "Site", value: (s) => String(s.site), render: (s) => `<span class="cell-main">${esc(s.site)}</span>` },
        { key: "account", label: "Compte", cls: "mono small", value: (s) => ptbStr(s.account), csv: (s) => ptbStr(s.account), render: (s) => (ptbStr(s.account) ? esc(ptbStr(s.account)) : `<span class="muted">—</span>`) },
        ...days.map((k) => ({
          key: "d:" + k, label: ptbDay(k), r: 1, num: 1,
          value: (s) => n(s, k)[0] + n(s, k)[1],
          csv: (s) => { const [ex, ad] = n(s, k); return ex ? `${ex}+${ad}` : ad; },
          cls: (s) => (n(s, k)[0] + n(s, k)[1] ? "" : "hot"),
          render: (s) => { const [ex, ad] = n(s, k); return `${ex ? `<span class="muted">${fmtFull(ex)}+</span>` : ""}${fmtFull(ad)}`; },
        })),
        { key: "planned", label: "Ajoutés", r: 1, num: 1, value: (s) => num(s.planned), csv: (s) => num(s.planned), render: (s) => `<b>${fmtFull(num(s.planned))}</b>` },
        { key: "waiting", label: "Reste", r: 1, num: 1, value: (s) => num(s.waiting), csv: (s) => num(s.waiting), render: (s) => fmtFull(num(s.waiting)) },
      ],
      foot: perSite.length > 1 ? `<tr><td class="first">Total</td><td></td>${days.map((k) => {
        const ex = perSite.reduce((a, s) => a + n(s, k)[0], 0), ad = perSite.reduce((a, s) => a + n(s, k)[1], 0);
        return `<td class="r num">${ex ? `<span class="muted">${fmtFull(ex)}+</span>` : ""}${fmtFull(ad)}</td>`;
      }).join("")}<td class="r num">${fmtFull(sum(perSite, "planned"))}</td><td class="r num last">${fmtFull(sum(perSite, "waiting"))}</td></tr>` : "",
    });
  });
}
async function ptbPlanPreview(btn) {
  const c = ptbPlanValidate(btn.closest('[data-ptb-root="planner"]'));
  if (c.errs.length) { toast(c.errs[0], { err: true }); return; }
  const o = ptbPlanOpts(), sig = JSON.stringify(o);
  /* Deux aperçus peuvent se croiser (bouton du bandeau pendant un calcul) : seule la réponse
     du dernier lancé compte, sinon une réponse lente effacerait un aperçu valide plus récent. */
  const seq = ++PTB.plan.previewSeq;
  await Pipe.gasAct(btn, "plan_pins", { ...o, dry: "1" }, {
    ok: (r) => `${ptbPlural(ptbPlanTotal(r), "pin", "pins")} dans l'aperçu`,
    after: (r, isBad) => {
      if (isBad || seq !== PTB.plan.previewSeq) return;
      const P = PTB.plan, raw = r?.options?.seed;
      const seed = raw == null || String(raw).trim() === "" ? "" : String(raw);
      if (JSON.stringify(ptbPlanOpts()) !== sig) {
        /* Options touchées pendant le calcul : on montre le résultat, mais il est déjà périmé. */
        Pipe.preview = null;
        P.out = { kind: "preview", result: r, opts: o, seed, at: Date.now(), stale: "options" };
        toast("Options modifiées pendant le calcul : relance l'aperçu.", { err: true });
      } else {
        Pipe.preview = { opts: o, seed, result: r, selKey: JSON.stringify(o.sites) };
        P.out = { kind: "preview", result: r, opts: o, seed, at: Date.now(), stale: false };
        if (!seed) toast("Apps Script n'a pas renvoyé de seed : cet aperçu ne peut pas être appliqué à l'identique.", { err: true });
      }
      ptbPlanPaintOut();
      document.getElementById("ptb-plan-out")?.scrollIntoView?.({ block: "nearest" });
    },
  });
  ptbPlanSync();
}
async function ptbPlanApply(btn) {
  const p = Pipe.preview;
  if (!p || !p.seed) { ptbPlanSync(); return; }
  if (JSON.stringify(ptbPlanOpts()) !== JSON.stringify(p.opts)) {
    ptbPlanInvalidate("options");
    toast("Les options ont changé depuis l'aperçu : relance l'aperçu.", { err: true });
    return;
  }
  const total = ptbPlanTotal(p.result);
  await Pipe.gasAct(btn, "plan_pins", { ...p.opts, seed: p.seed, dry: "0" }, {
    confirm: { title: "Appliquer l'aperçu", ok: "Écrire le planning",
      body: `<p>Écrire ce planning dans le Sheet ? <b>${esc(ptbPlural(total, "pin", "pins"))}</b> sur <b>${esc(sitesLabel(p.opts.sites))}</b>, du <b>${esc(ptbDay(p.opts.start, fmtDayLong))}</b> pendant <b>${esc(p.opts.days)} jours</b>.</p>
        <p class="hint">Même tirage que l'aperçu (seed <code>${esc(p.seed)}</code>), entre ${esc(p.opts.h_start)} h et ${esc(p.opts.h_end)} h (${esc(p.opts.tz)}). Remplit la colonne « Planifié pour » de l'onglet Pins.</p>` },
    ok: (r) => `${ptbPlural(r?.written != null ? num(r.written) : (ptbPlanTotal(r) || 0), "pin planifié", "pins planifiés")}`,
    bad: (r) => gasBad(r) || (r?.written != null && num(r.written) === 0 && ptbPlanTotal(r) > 0),
    fail: (r) => (gasBad(r) ? gasFail(r) : "Aucun pin écrit dans le Sheet : vérifie la colonne « Planifié pour » de l'onglet Pins."),
    after: (r, isBad) => {
      if (isBad) return;
      const got = ptbObj(r), prev = ptbObj(p.result);
      const res = { ...prev, ...got };
      const fromPreview = !ptbArr(got.perSite).length && ptbArr(prev.perSite).length > 0;
      if (fromPreview) { res.perSite = prev.perSite; res.days = ptbArr(got.days).length ? got.days : prev.days; res.shortage = got.shortage ?? prev.shortage; res.skipped = got.skipped ?? prev.skipped; }
      Pipe.preview = null;
      PTB.plan.previewSeq++; // un aperçu encore en vol a été calculé avant l'écriture : il est ignoré
      PTB.plan.out = { kind: "applied", result: res, opts: p.opts, seed: p.seed, at: Date.now(), stale: false, fromPreview };
      ptbPlanPaintOut();
    },
  });
  ptbPlanSync();
}
async function ptbPlanUnplan(btn) {
  const sel = Pipe.selected();
  await Pipe.gasAct(btn, "unplan_pins", { sites: sel }, {
    confirm: { title: "Déplanifier", ok: "Effacer les planifications", danger: true,
      body: `<p>Effacer les planifications futures non envoyées de <b>${esc(sitesLabel(sel))}</b> ?</p>
        <p class="hint">${sel.length ? "" : "Aucun site sélectionné : tous les comptes sont concernés. "}Les pins déjà envoyés à Blotato ne sont pas touchés.</p>` },
    ok: (r) => `${fmtFull(num(r?.cleared))} planification(s) effacée(s)`,
    after: (r, isBad) => { if (!isBad) { PTB.plan.previewSeq++; ptbPlanInvalidate("unplan"); } },
  });
  ptbPlanSync();
}

/* Envoi automatique (déclencheur Apps Script → WF3b) */
function ptbAutoHtml(r) {
  if (!r || r.error || r.on == null) return `<div class="btn-row">${stateTag("off", "Statut inconnu", r?.error ? String(r.error) : "")}${r?.error ? `<span class="small muted">${esc(String(r.error).slice(0, 160))}</span>` : ""}</div>`;
  const on = ptbOn(r), l = ptbObj(r.last);
  const last = l.at
    ? `dernier envoi ${when(l.at)} : ${esc(fmtFull(num(l.sent)))} pin(s)${num(l.expired) ? `, ${esc(fmtFull(num(l.expired)))} expiré(s)` : ""}${l.ok === false ? ` · <span class="t-crit"${l.error ? ` title="${esc(l.error)}"` : ""}>erreur</span>` : ""}`
    : "aucun envoi enregistré";
  return `<div class="btn-row">${stateTag(on ? "ok" : "warn", on ? "Activé" : "Coupé")}<span class="small ink-2">${last}</span></div>`;
}
function ptbAutoPaint(r) {
  PTB.plan.auto = r;
  const el = document.getElementById("ptb-auto-line");
  if (el) el.innerHTML = ptbAutoHtml(r);
}
const ptbAutoState = (r) => (r && typeof r === "object" && ("on" in r || "last" in r) ? r : null);
/** Lecture discrète du statut à chaque rendu : pas de toast ; en échec, « Statut inconnu ». */
async function ptbAutoFetch(force) {
  const P = PTB.plan;
  if (!force && P.autoBusy && Date.now() - P.autoBusy < 60_000) return;
  const seq = ++P.autoSeq;
  P.autoBusy = Date.now();
  let r;
  try { r = await gas("auto_status", {}); } catch (e) { r = { error: e?.message || "statut indisponible" }; }
  if (seq !== P.autoSeq) return;
  P.autoBusy = 0;
  ptbAutoPaint(!r || gasBad(r) ? { error: r?.error || r?.message || "statut indisponible" } : r);
}
async function ptbAutoStatus(btn) {
  let raw = null, threw = null;
  await act(btn, {
    run: async () => {
      PTB.plan.autoSeq++; PTB.plan.autoBusy = 0;
      try { raw = await gas("auto_status", {}); } catch (e) { threw = e; throw e; }
      return raw;
    },
    bad: gasBad, fail: gasFail,
    ok: (x) => (x?.on == null ? "Statut lu, mais Apps Script ne dit pas si l'envoi est actif" : ptbOn(x) ? "Envoi automatique activé" : "Envoi automatique coupé"),
  });
  /* La ligne d'état reprend le vrai motif d'échec (et pas un « Coupé » trompeur). */
  ptbAutoPaint(threw ? { error: threw.message || "statut indisponible" } : raw && !gasBad(raw) ? raw : { error: gasFail(raw) });
}
/** Après auto_on / auto_off / send_planned : état repris de la réponse, sinon relu discrètement. */
const ptbAutoAfter = (x, isBad) => { const s = ptbAutoState(x); if (s) ptbAutoPaint(s); else if (!isBad) ptbAutoFetch(true); };
async function ptbAutoOn(btn) {
  await act(btn, {
    confirm: { title: "Activer l'envoi automatique", ok: "Activer",
      body: `<p>Activer l'envoi automatique ? Apps Script appellera WF3b toutes les 10 min pour les pins dont l'heure est arrivée.</p><p class="hint">Les pins planifiés partiront vers Blotato sans autre confirmation. « Couper » arrête le déclencheur.</p>` },
    run: () => { PTB.plan.autoSeq++; PTB.plan.autoBusy = 0; return gas("auto_on", {}); },
    bad: (x) => gasBad(x) || (x.on != null && !ptbOn(x)),
    fail: (x) => x?.error || x?.message || "Impossible d'activer l'envoi automatique",
    ok: () => "Envoi automatique activé · WF3b toutes les 10 min",
    after: ptbAutoAfter,
  });
}
async function ptbAutoOff(btn) {
  await act(btn, {
    confirm: { title: "Couper l'envoi automatique", ok: "Couper", danger: true,
      body: `<p>Couper l'envoi automatique des pins planifiés ?</p><p class="hint">Les pins planifiés restent dans le Sheet mais ne partent plus vers Blotato, jusqu'à la réactivation ou un envoi manuel.</p>` },
    run: () => { PTB.plan.autoSeq++; PTB.plan.autoBusy = 0; return gas("auto_off", {}); },
    bad: (x) => gasBad(x) || ptbOn(x),
    fail: (x) => x?.error || x?.message || "L'envoi automatique est toujours actif",
    ok: () => "Envoi automatique coupé",
    after: ptbAutoAfter,
  });
}
async function ptbAutoSend(btn) {
  await Pipe.gasAct(btn, "send_planned", {}, {
    confirm: { title: "Envoyer les pins dus", ok: "Envoyer maintenant",
      body: `<p>Envoyer maintenant à Blotato les pins dont l'heure est passée ?</p><p class="hint">Seuls les pins planifiés dont l'heure est arrivée partent ; les autres attendent leur heure.</p>` },
    ok: (r) => r?.message || `${fmtFull(num(r?.sent))} pin(s) envoyé(s)${num(r?.expired) ? `, ${fmtFull(num(r.expired))} expiré(s)` : ""}`,
    after: ptbAutoAfter,
  });
}

/* ═══════════ Coûts ═══════════ */
PipeTabs.costs = {
  render(d, el, ctx) {
    ptbBind(ctx?.el || el);
    const S = PTB.cost;
    /* Coûts enregistrés : on garde les valeurs saisies jusqu'à la relecture réussie du Sheet. */
    if (S.saved && Pipe.row?.ok !== false && (!S.saved.t || Date.parse(Pipe.row?.taken_at) > Date.parse(S.saved.t))) { S.edit = {}; S.saved = null; }
    const root = ptbMount(el, "costs", () => {
      const U = ptbObj(d.costs);
      const field = ([k, label, unit]) => `<label for="ptb-c-${k}">${label} (MAD)</label>
        <div class="inline"><input type="number" id="ptb-c-${k}" data-k="${k}" step="0.01" min="0" inputmode="decimal" placeholder="non défini" value="${esc(S.edit[k] ?? ptbNumStr(U[k]))}" aria-describedby="ptb-cost-err" style="width:140px"><span class="small muted">par ${unit}</span></div>`;
      return `
      <div id="ptb-cost-kpis">${skelKpis(6)}</div>
      ${chartPanel({ id: "ptb-cost", title: "Coût par jour · 30 jours", size: "tall",
        legend: [{ label: "Articles", color: "--series-1", kind: "sq" }, { label: "Images", color: "--series-2", kind: "sq" }, { label: "Pins", color: "--series-3", kind: "sq" }] })}
      <div class="grid g-2">
        ${panel({ title: "Par site", tools: csvBtn("ptb-cost-sites"), flush: true, body: `<div id="ptb-cost-sites">${skelRows(6)}</div>` })}
        ${panel({ title: "Coûts unitaires", meta: "MAD par élément généré", body: `
          <form data-ptb-form="cost" novalidate>
            <div class="form-grid">${PTB_COSTS.map(field).join("")}</div>
            <div id="ptb-cost-err" class="hint t-crit" role="alert" hidden></div>
            <div class="btn-row" style="margin-top:14px"><button class="btn primary" type="submit" data-ptb="cost-save">Enregistrer</button><span class="small" id="ptb-cost-state"></span></div>
            <p class="hint">Stockés dans Apps Script (Script Properties), comme dans la v3.</p>
          </form>` })}
      </div>`;
    });
    ptbCostFill(d, root);
  },
};
function ptbCostFill(d, root) {
  const C = ptbObj(d.cost), U = ptbObj(d.costs), hasCost = !!d.cost && typeof d.cost === "object";

  ptbBlock($("#ptb-cost-kpis", root), (b) => {
    b.innerHTML = !hasCost
      ? panel({ body: emptyBox("Pas de coûts dans la lecture du Sheet", "Le bloc « cost » manque. Relis le Sheet ; s'il manque encore, vérifie Dashboard.gs. Les coûts unitaires restent modifiables plus bas.", ptbRefreshBtn()) })
      : kpis([
        kpi({ label: "Coût total", value: ptbMad(C.total), title: madPrec(C.total) }),
        kpi({ label: "Ce mois", value: ptbMad(C.month), title: madPrec(C.month), sub: ptbIsDay(d.today) ? esc(fmtMonth(d.today)) : "" }),
        kpi({ label: "Par article publié", value: ptbMad(C.perPublished, true) }),
        kpi({ label: "Articles", value: ptbMad(C.articles), title: madPrec(C.articles), sub: `${madPrec(ptbCostNum(U.article))} / article` }),
        kpi({ label: "Images", value: ptbMad(C.images), title: madPrec(C.images), sub: `${madPrec(ptbCostNum(U.image))} / image` }),
        kpi({ label: "Pins", value: ptbMad(C.pins), title: madPrec(C.pins), sub: `${madPrec(ptbCostNum(U.pin))} / pin` }),
      ]);
  });

  try {
    const daily = ptbArr(C.daily).filter((x) => x && typeof x === "object" && ptbIsDay(x.d));
    const labels = daily.map((x) => String(x.d).slice(0, 10));
    Charts.bar("ptb-cost", {
      title: "Coût par jour", labels, money: true,
      series: [
        { label: "Articles", data: daily.map((x) => numOrNull(x.a)), color: "--series-1" },
        { label: "Images", data: daily.map((x) => numOrNull(x.i)), color: "--series-2" },
        { label: "Pins", data: daily.map((x) => numOrNull(x.p)), color: "--series-3" },
      ],
      empty: labels.length
        ? { title: "Aucun coût sur 30 jours", text: "Rien n'a été généré sur la période, ou les coûts unitaires valent 0 (voir « Coûts unitaires »)." }

/** Formulaire : un champ modifié (ou en cours de saisie) n'est jamais réécrit par une relecture. */
function ptbCostFormSync(root, U) {
  PTB_COSTS.forEach(([k]) => {
    const inp = $(`#ptb-c-${k}`, root);
    if (!inp || document.activeElement === inp) return;
    const want = PTB.cost.edit[k] !== undefined ? PTB.cost.edit[k] : ptbNumStr(U[k]);
    if (inp.value !== want) inp.value = want;

}
function ptbCostState(root, U) {

  el.innerHTML = S.saved ? stateTag("run", "Enregistré · en attente de la relecture du Sheet")

}
function ptbCostField(t) {

}
async function ptbCostSave(btn) {

    ok: () => "Coûts enregistrés · recalcul en cours",

/* Réglages (table settings). def = défaut codé dans le backend, utilisé seulement si la ligne
   n'existe pas : un champ vidé SUPPRIME la ligne, il n'écrit jamais 0, null ou "". */
const ST_FIELDS = [
  { key: "legacy_dashboard_url", label: "URL dashboard v3", type: "url", ph: "https://…" },
  { key: "apps_script_url", label: "URL web app Apps Script (finit par /exec)", type: "url", ph: "https://script.google.com/macros/s/…/exec" },
  { key: "gsc_daily_retention_days", label: "Détail requêtes/pages (jours)", type: "int", def: 90 },
  { key: "gsc_daily_top_n", label: "Requêtes / pages par jour", type: "int", def: 250 },
  { key: "monthly_top_n", label: "Requêtes / pages par mois", type: "int", def: 1000 },
  { key: "ga4_source_top_n", label: "Sources GA4 par jour", type: "int", def: 50 },
  { key: "backfill_months", label: "Historique à importer (mois)", type: "int", def: 16 },
  { key: "alert_stuck_minutes", label: "Alerte exécution bloquée (min)", type: "int", def: 90 },
  { key: "pipeline_failed_alert", label: "Alerte échecs pipeline (seuil)", type: "int", def: 10 },
  { key: "pipeline_pin_gap_hours", label: "Alerte « aucun pin planifié » (h)", type: "int", def: 48 },
];
const ST_INT_MAX = 2147483647;

/* Dernières données lues (pour les confirmations) + écritures en attente (pause du rafraîchissement). */
const StState = { sites: [], sitesOk: false, accounts: [], gsc: null, ga4: null, setMap: {}, months: 16, pending: 0 };

const stHas = (map, k) => Object.prototype.hasOwnProperty.call(map || {}, k);
const stCut = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
/** Valeur jsonb (déjà parsée par supabase-js : nombre ou chaîne) → texte du champ.
 *  Une chaîne restée entre guillemets (double encodage) est montrée TELLE QUELLE : le backend
 *  la lit avec ses guillemets (setting_int échoue, l'URL Apps Script aussi), il faut la voir pour la corriger. */
function stShow(v) {
  if (v == null) return "";
  if (typeof v === "string") return v.trim();
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  try { return JSON.stringify(v); } catch (_) { return String(v); }
}
/** Ce que le backend utilise vraiment : la valeur enregistrée telle quelle (même 0), sinon le défaut. */
const stEff = (map, f) => (stHas(map, f.key) ? Number(stShow(map[f.key])) : f.def);
const stValidInt = (n) => Number.isInteger(n) && n > 0 && n <= ST_INT_MAX;
/** Lecture d'un champ saisi : {ok, op:'set'|'del', value} ou {ok:false, err}. */
function stParse(f, raw) {
  if (raw === "") return { ok: true, op: "del" };
  if (f.type === "int") {
    if (!/^\d+$/.test(raw)) return { ok: false, err: /[.,]/.test(raw) ? "Nombre entier, sans décimale." : "Nombre entier supérieur à 0, chiffres seulement." };
    const n = parseInt(raw, 10);
    if (n <= 0) return { ok: false, err: `Supérieur à 0. Vide le champ pour revenir au défaut (${f.def}).` };
    if (n > ST_INT_MAX) return { ok: false, err: "Nombre trop grand." };
    return { ok: true, op: "set", value: n };
  }
  if (!/^https?:\/\/\S+$/i.test(raw)) return { ok: false, err: "Adresse complète en http(s)://…, ou champ vide." };
  return { ok: true, op: "set", value: raw };
}
/* Les URL prennent toute la largeur (label au-dessus) : le panneau est en demi-largeur. */
const stFieldHtml = (f) => `
  <label for="st-f-${f.key}"${f.type === "url" ? ` style="grid-column:1/-1;margin-bottom:-6px"` : ""}>${esc(f.label)}</label>
  <div${f.type === "url" ? ` style="grid-column:1/-1"` : ""}>
    <div class="inline">
      <input id="st-f-${f.key}" name="${f.key}" data-st-field="${f.key}" autocomplete="off" spellcheck="false" aria-describedby="st-e-${f.key} st-w-${f.key}"
        ${f.type === "int" ? `type="text" inputmode="numeric" class="num" style="width:100%;max-width:140px" placeholder="défaut : ${f.def}"` : `type="url" inputmode="url" style="flex:1 1 200px" placeholder="${esc(f.ph)}"`}>
      <span class="tag" id="st-d-${f.key}" hidden>modifié</span>
    </div>
    <div class="st-fmsg t-crit" id="st-e-${f.key}" role="alert" hidden></div>
    <div class="st-fmsg t-crit" id="st-w-${f.key}" hidden></div>
  </div>`;
/** Marque un champ modifié (comparé à la valeur enregistrée). */
function stMark(inp) {
  const d = inp.value.trim() !== (inp.dataset.orig ?? "");
  inp.dataset.dirty = d ? "1" : "";
  inp.classList.toggle("st-dirty", d);
  const tag = document.getElementById("st-d-" + inp.dataset.stField); if (tag) tag.hidden = !d;
}
function stFieldErr(inp, msg) {
  const box = document.getElementById("st-e-" + inp.dataset.stField);
  if (box) { box.textContent = msg || ""; box.hidden = !msg; }
  if (msg) inp.setAttribute("aria-invalid", "true"); else inp.removeAttribute("aria-invalid");
}
function stDirtyCount(el) {
  const n = $$("input[data-st-field]", el).filter((i) => i.dataset.dirty === "1").length;
  $("#st-dirty-n", el).textContent = n ? `${plural(n, "modification non enregistrée", "modifications non enregistrées")}` : "";
  $("[data-st-reset]", el).hidden = !n;
  return n;
}
/** Remplit le formulaire. Un champ que l'utilisateur a modifié garde sa saisie (rechargement silencieux). */
function stFillSettings(el, list) {
  const map = Object.fromEntries((list || []).map((r) => [r.key, r.value]));
  ST_FIELDS.forEach((f) => {
    const inp = $(`#st-f-${f.key}`, el); if (!inp) return;
    const orig = stShow(map[f.key]);
    inp.dataset.orig = orig;
    if (inp.dataset.dirty !== "1") { inp.value = orig; stFieldErr(inp, ""); }
    stMark(inp);
    /* Valeur déjà enregistrée invalide (ex. 0 écrit par l'ancien front) : le backend l'utilise telle quelle. */
    const w = $(`#st-w-${f.key}`, el);
    let warn = "";
    /* setting_int fait (value #>> '{}')::int : seuls des chiffres passent (pas « 1e3 », « 90.5 », « "90" »). */
    if (f.type === "int" && stHas(map, f.key) && !(/^\d+$/.test(orig) && stValidInt(Number(orig))))
      warn = orig
        ? `Valeur enregistrée invalide (« ${stCut(orig, 40)} ») : le backend l'utilise telle quelle. Vide le champ et enregistre pour revenir au défaut (${f.def}).`
        : `Valeur enregistrée vide : le backend ne peut pas la lire. Tape un entier (par ex. ${f.def}) puis enregistre.`;
    if (f.type === "url" && orig && !/^https?:\/\//i.test(orig)) warn = `Valeur enregistrée invalide (« ${stCut(orig, 60)} ») : corrige-la ou vide le champ.`;
    w.textContent = warn; w.hidden = !warn;
  });
  const custom = ST_FIELDS.filter((f) => stHas(map, f.key)).length;
  $("#st-set-meta", el).textContent = `${custom} personnalisé${custom > 1 ? "s" : ""} · ${ST_FIELDS.length - custom} au défaut`;
  stDirtyCount(el);
  return map;
}

/** Options d'un menu de liaison : « — », puis les entrées du même domaine en tête. */
function stOpts(list, cur, domain, labelOf) {
  const opt = (x) => `<option value="${esc(x.id)}"${x.id === cur ? " selected" : ""}>${esc(labelOf(x))}</option>`;
  let html = `<option value=""${cur ? "" : " selected"}>—</option>`;
  if (cur && !list.some((x) => x.id === cur)) html += `<option value="${esc(cur)}" selected>(liaison inconnue)</option>`;
  const same = list.filter((x) => x.domain && x.domain === domain), other = list.filter((x) => !(x.domain && x.domain === domain));
  html += same.length && other.length
    ? `<optgroup label="Ce domaine">${same.map(opt).join("")}</optgroup><optgroup label="Autres domaines">${other.map(opt).join("")}</optgroup>`
    : list.map(opt).join("");
  return html;
}
const stGscLabel = (g) => g.site_url || "—";
const stGa4Label = (p) => `${p.display_name || "Sans nom"} (${p.property_id})`;
const stLinkCell = (s, col, list, err, labelOf, aria) => {
  if (!list) return `<span class="muted" title="${esc(err?.message || err || "")}">liste indisponible</span>`;
  const cur = s[col] || "";
  const curItem = list.find((x) => x.id === cur);
  /* width:100% + min-width : le menu peut rétrécir, le tableau tient à 1280 px sans défilement horizontal. */
  return `<select class="sm" style="width:100%;min-width:150px;max-width:240px" data-st-link="${col}" data-id="${esc(s.id)}" data-domain="${esc(s.domain)}" data-prev="${esc(cur)}" aria-label="${esc(aria)} de ${esc(s.domain)}" title="${esc(curItem ? labelOf(curItem) : "Aucune liaison")}">${stOpts(list, cur, s.domain, labelOf)}</select>`;
};

/** Colonne « Import » : progression de la file sync_jobs (30 derniers jours). */
function stImportCell(s, prog, progErr) {
  if (prog == null) return `<span class="muted" title="${esc(progErr?.message || "")}">indisponible</span>`;
  const p = prog[s.id];
  if (!p) {
    if (s.tracked && !s.gsc_site_id && !s.ga4_property_id) return `<span class="tag" title="Lie une propriété Search Console ou GA4 pour importer des données">aucune source liée</span>`;
    if (!s.tracked) return `<span class="muted">—</span>`;
    return `<span class="muted">— ${s.last_sync_at ? "à jour" : "pas encore importé"}</span>`;
  }
  const q = num(p.queued), run = num(p.running), done = num(p.done), failed = num(p.failed);
  const total = q + run + done + failed, pctv = total ? Math.round((done / total) * 100) : 0;
  const title = `${fmtFull(q)} en file · ${fmtFull(run)} en cours · ${fmtFull(done)} faites · ${fmtFull(failed)} en erreur`;
  return `<span class="nowrap" title="${esc(title)}">${run ? lamp("run") + " " : ""}<span class="meter" aria-hidden="true"><i style="width:${pctv}%"></i></span> <span class="num small">${pctv} %</span><span class="sr-only"> importé, ${esc(title)}</span></span>${failed ? ` ${stateTag("crit", `${fmtFull(failed)} en erreur`, p.last_error || "")}` : ""}`;
}

/* ═══════════ Actions ═══════════ */
async function stConnect(btn) {
  busy(btn, true);
  try {
    const r = await fn("google-auth", { action: "start", return_to: location.origin + location.pathname });
    if (!r?.url) throw new Error("Google n'a pas renvoyé d'adresse de connexion.");
    location.href = r.url; /* le bouton reste occupé jusqu'au départ vers Google */
  } catch (e) { toast(e.message || String(e), { err: true }); busy(btn, false); }
}
const stReload = () => { if (Router.view === "settings") Router.render({ silent: true }); };

/* Re-scanner / Déconnecter vivent dans une ligne du tableau : pendant l'appel, pas de
   rafraîchissement auto (il redessinerait la ligne, perdrait l'état occupé et permettrait un 2e clic). */
async function stRescan(btn) {
  const id = btn.dataset.stScan, email = btn.dataset.email || "compte";
  StState.pending++;
  try {
    await act(btn, {
      run: () => fn("google-auth", { action: "discover", account_id: id }),
      bad: (r) => !r?.results?.[id] || !!r.results[id].error,
      fail: (r) => (r?.results?.[id]?.error ? `Scan de ${email} échoué : ${r.results[id].error}` : `Scan de ${email} : aucun résultat renvoyé`),
      ok: (r) => `${num(r.results[id].gsc)} sites GSC · ${num(r.results[id].ga4)} propriétés GA4`,
      after: () => { Store.drop("google_accounts", "sites", "site_overview"); Health.load(true); stReload(); },
    });
  } finally { StState.pending--; }
}
async function stDisconnect(btn) {
  const id = btn.dataset.stDisc, email = btn.dataset.email || "ce compte";
  StState.pending++;
  try {
    await act(btn, {
      confirm: { title: "Déconnecter le compte", danger: true, ok: "Déconnecter",
        body: `<p>Déconnecter <b>${esc(email)}</b> ? L'accès Google sera révoqué. Les sites et les données déjà importées restent ; une alerte « Compte Google déconnecté » peut rester à résoudre à la main.</p>` },
      run: () => fn("google-auth", { action: "disconnect", account_id: id }),
      bad: (r) => r?.ok === false,
      fail: (r) => r?.error || `Déconnexion de ${email} échouée`,
      ok: () => `Compte ${email} déconnecté`,
      after: () => { Store.drop("google_accounts", "sites", "site_overview", "alerts_open"); Health.load(true); stReload(); },
    });
  } finally { StState.pending--; }
}
async function stTrackAll(btn) {
  const all = StState.sites, untracked = all.filter((s) => !s.tracked).length;
  if (StState.sitesOk && !all.length) return toast("Aucun site détecté : connecte d'abord un compte Google", { err: true });
  if (StState.sitesOk && !untracked) return toast("Tous les sites sont déjà suivis");
  /* Liste illisible : on ne connaît pas le nombre, on ne l'invente pas. */
  const q = !StState.sitesOk ? "Suivre tous les sites détectés ?" : all.length === 1 ? "Suivre le site détecté ?" : `Suivre les ${fmtFull(all.length)} sites détectés ?`;
  const more = StState.sitesOk ? `${plural(untracked, "site n'est pas encore suivi", "sites ne sont pas encore suivis")}. ${untracked > 1 ? "Ils apparaîtront" : "Il apparaîtra"} dans les tableaux SEO ; lance ensuite « Importer l'historique ».` : "Les sites suivis apparaissent dans les tableaux SEO ; lance ensuite « Importer l'historique ».";
  await act(btn, {
    confirm: { title: "Tout suivre", ok: "Tout suivre", body: `<p>${q}</p><p class="hint">${more}</p>` },
    run: async () => {
      const d = await write(sb.from("sites").update({ tracked: true }).neq("domain", "").select("id"), "suivi des sites");
      if (Array.isArray(d) && !d.length) throw new ApiError("Aucun site modifié : accès refusé ou session expirée. Recharge la page.");
      return true;
    },
    ok: () => "Tous les sites sont suivis",
    after: () => { Store.drop("sites", "site_overview"); Health.load(true); stReload(); },
  });
}
async function stBackfill(btn) {
  const tracked = StState.sites.filter((s) => s.tracked).length;
  if (StState.sitesOk && !tracked) return toast("Aucun site suivi : active « Suivre » d'abord", { err: true });
  const m = StState.months;
  const who = !StState.sitesOk ? "pour les sites suivis" : tracked === 1 ? "pour le site suivi" : `pour les ${fmtFull(tracked)} sites suivis`;
  await act(btn, {
    confirm: { title: "Importer l'historique", ok: "Mettre en file",
      body: `<p>Mettre en file l'import de <b>${esc(String(m))} mois</b> ${who} ?</p>
        <p class="hint">Le worker traite la file toutes les 2 min (≈ 1 à 3 h pour 13 sites). Les mois déjà importés sont réimportés ; les tâches déjà en file ne sont pas doublées.</p>
        ${stValidInt(m) ? "" : `<p class="hint">${lamp("warn")} « Historique à importer » vaut ${esc(String(m))} : rien ne sera importé. Corrige-le dans Réglages.</p>`}` },
    run: () => fn("seo-sync", { action: "backfill" }),
    bad: (r) => num(r?.sites) === 0,
    fail: () => "Aucun site suivi : active « Suivre » d'abord",
    ok: (r) => (num(r.queued) === 0 ? "Déjà en file : rien de nouveau à importer" : `${plural(num(r.queued), "tâche", "tâches")} en file pour ${plural(num(r.sites), "site", "sites")}`),
    after: () => { Store.drop("sites"); stReload(); },
  });
}
async function stWork(btn) {
  const span = $("span", btn);
  span.textContent = "Traitement (≈ 2 min max)";
  const tasks = (n) => plural(n, "tâche traitée", "tâches traitées");
  try {
    await act(btn, {
      run: () => fn("seo-sync", { action: "work" }),
      bad: (r) => num(r?.failed) > 0,
      ok: (r) => (num(r?.done) ? tasks(num(r.done)) : "0 tâche traitée : la file est vide ou déjà prise par le worker"),
      fail: (r) => `${tasks(num(r.done))}, ${fmtFull(r.failed)} en erreur : ${(r.errors || [])[0] || "erreur inconnue"}`,
    });
  } finally {
    span.textContent = "Traiter la file maintenant";
    /* Même après un délai dépassé, le worker a pu avancer : on relit. */
    Store.drop("sites", "site_overview"); Health.load(true); stReload();
  }
}

/** Interrupteur « Suivre » : confirmation, écriture, retour à l'ancienne valeur si annulé ou refusé. */
async function stOnTrack(inp) {
  const on = inp.checked, id = inp.dataset.stTrack, domain = inp.dataset.domain || "ce site";
  StState.pending++;
  try {
    const res = await act(inp, {
      confirm: on
        ? { title: "Suivre le site", ok: "Suivre", body: `<p>Suivre <b>${esc(domain)}</b> ?</p><p class="hint">Il apparaîtra dans les tableaux SEO. Lance ensuite « Importer l'historique » pour récupérer ses données.</p>` }
        : { title: "Ne plus suivre", ok: "Ne plus suivre", danger: true, body: `<p>Ne plus suivre <b>${esc(domain)}</b> ? Ses données restent, il disparaît des tableaux.</p>` },
      run: async () => {
        const d = await write(sb.from("sites").update({ tracked: on }).eq("id", id).select("id"), "suivi du site");
        if (Array.isArray(d) && !d.length) throw new ApiError(`${domain} n'a pas été modifié : site introuvable ou accès refusé. Recharge la page.`);
        return true;
      },
      ok: () => (on ? `${domain} est suivi` : `${domain} n'est plus suivi`),
      after: () => { Store.drop("sites", "site_overview"); Health.load(true); stReload(); },
    });
    if (!res) inp.checked = !on;
  } finally { StState.pending--; }
}
/** Menu de liaison GSC / GA4 : envoie null pour délier, jamais ''. */
async function stOnLink(sel) {
  const col = sel.dataset.stLink, id = sel.dataset.id, domain = sel.dataset.domain || "ce site";
  const prev = sel.dataset.prev || "", val = sel.value || "";
  if (val === prev) return;
  const isGsc = col === "gsc_site_id";
  const list = (isGsc ? StState.gsc : StState.ga4) || [];
  const item = list.find((x) => x.id === val);
  const label = item ? (isGsc ? stGscLabel(item) : stGa4Label(item)) : sel.selectedOptions[0]?.textContent || val;
  const notes = [];
  if (item?.domain && item.domain !== domain) notes.push(`Cette ${isGsc ? "propriété Search Console" : "propriété GA4"} correspond au domaine ${esc(item.domain)}.`);
  const other = val && StState.sites.find((s) => s.id !== id && s[col] === val);
  if (other) notes.push(`Elle est déjà liée à ${esc(other.domain)}.`);
  const what = isGsc ? "la Search Console" : "la propriété GA4";
  StState.pending++;
  try {
    const res = await act(sel, {
      confirm: val
        ? { title: isGsc ? "Lier la Search Console" : "Lier GA4", ok: "Lier", body: `<p>Lier <b>${esc(domain)}</b> à <b>${esc(label)}</b> ?</p>${notes.map((n) => `<p class="hint">${lamp("warn")} ${n}</p>`).join("")}` }
        : { title: isGsc ? "Délier la Search Console" : "Délier GA4", ok: "Délier", body: `<p>Délier ${what} de <b>${esc(domain)}</b> ? Le prochain scan la reliera automatiquement.</p>` },
      run: async () => {
        const d = await write(sb.from("sites").update({ [col]: val || null }).eq("id", id).select("id"), "liaison du site");
        if (Array.isArray(d) && !d.length) throw new ApiError(`${domain} n'a pas été modifié : site introuvable ou accès refusé. Recharge la page.`);
        return true;
      },
      ok: () => (val ? `Liaison enregistrée : ${domain} → ${label}` : `${domain} délié de ${what}`),
      after: () => { Store.drop("sites", "site_overview"); stReload(); },
    });
    if (res) sel.dataset.prev = val; else sel.value = prev;
  } finally { StState.pending--; }
}
/** Enregistre UNIQUEMENT les champs modifiés ; un champ vidé supprime la ligne (= défaut du backend). */
async function stSaveSettings(el, btn) {
  const inputs = $$("input[data-st-field]", el).filter((i) => i.dataset.dirty === "1");
  if (!inputs.length) return toast("Aucune modification à enregistrer");
  const changes = [], bad = [];
  inputs.forEach((inp) => {
    const f = ST_FIELDS.find((x) => x.key === inp.dataset.stField);
    const p = stParse(f, inp.value.trim());
    if (!p.ok) { stFieldErr(inp, p.err); bad.push(inp); return; }
    if (p.op === "del" && !stHas(StState.setMap, f.key)) { stFieldErr(inp, ""); return; } /* déjà au défaut */
    stFieldErr(inp, "");
    changes.push({ f, inp, ...p });
  });
  if (bad.length) { bad[0].focus(); return toast(bad.length > 1 ? `${bad.length} champs à corriger` : "Un champ est à corriger", { err: true }); }
  if (!changes.length) return toast("Aucune modification à enregistrer");

  const items = changes.map((c) => c.op === "del"
    ? `<li><code>${esc(c.f.key)}</code> → retour au défaut (${c.f.type === "int" ? esc(String(c.f.def)) : "vide"})</li>`
    : `<li><code>${esc(c.f.key)}</code> → <b>${esc(stCut(String(c.value), 80))}</b></li>`).join("");
  const warns = [];
  const apps = changes.find((c) => c.f.key === "apps_script_url");
  if (apps?.op === "set" && !/\/exec(\?.*)?$/.test(apps.value)) warns.push("L'URL Apps Script ne finit pas par /exec : vérifie que c'est l'URL du web app déployé.");
  if (apps?.op === "del") warns.push("Sans URL Apps Script, le pipeline ne peut plus lire le Sheet.");
  const ret = changes.find((c) => c.f.key === "gsc_daily_retention_days");
  if (ret) {
    const before = stEff(StState.setMap, ret.f), after = ret.op === "del" ? ret.f.def : ret.value;
    if (stValidInt(before) && after < before) warns.push(`Le détail jour par jour plus vieux que ${esc(String(after))} jours sera supprimé à la prochaine synchro quotidienne.`);
  }
  if (changes.some((c) => c.f.key === "backfill_months")) warns.push("Le nombre de mois s'applique au prochain « Importer l'historique ».");

  const ups = changes.filter((c) => c.op === "set"), dels = changes.filter((c) => c.op === "del");
  let saved = false, tried = false;
  try {
    await act(btn, {
      confirm: { title: "Enregistrer les réglages", ok: "Enregistrer",
        body: `<p>${plural(changes.length, "modification", "modifications")} :</p><ul>${items}</ul>${warns.map((w) => `<p class="hint">${lamp("warn")} ${w}</p>`).join("")}` },
      run: async () => {
        tried = true;
        const now = new Date().toISOString();
        if (ups.length) await write(sb.from("settings").upsert(ups.map((c) => ({ key: c.f.key, value: c.value, updated_at: now }))), "réglages");
        if (dels.length) {
          /* Un DELETE refusé par RLS ne lève pas d'erreur : 0 ligne. On relit les clés supprimées pour le voir. */
          const d = await write(sb.from("settings").delete().in("key", dels.map((c) => c.f.key)).select("key"), "réglages (retour au défaut)");
          if (Array.isArray(d) && !d.length) throw new ApiError("Retour au défaut non appliqué : accès refusé ou session expirée. Recharge la page.");
        }
        saved = true;
        return true;
      },
      ok: () => (apps?.op === "set" ? "Réglages enregistrés · clique « Actualiser depuis le Sheet » dans Pipeline pour tester l'URL" : "Réglages enregistrés"),
    });
  } finally {
    if (saved) changes.forEach((c) => { c.inp.dataset.dirty = ""; });
    /* Même en échec partiel (upsert passé, suppression refusée), on relit l'état réel. */
    if (tried) { Store.drop("settings"); stReload(); }
  }
}
function stPwError(error) {
  const m = error?.message || String(error);
  if (/different from the old/i.test(m)) return "C'est déjà ton mot de passe actuel : choisis-en un autre.";
  if (/reauthenticat|recent login/i.test(m)) return "Supabase demande une connexion récente : déconnecte-toi, reconnecte-toi puis réessaie.";
  if (/weak|at least/i.test(m)) return `Mot de passe refusé (trop faible) : ${m}`;
  return `Mot de passe refusé : ${m}`;
}

function pinDrawRec(box, res, f) {
  if (!res.ok) { box.innerHTML = errBox(res.error); return; }
  const data = (res.data || []).filter(f);
  const days = [...new Set(data.map((x) => String(x.day).slice(0, 10)))].sort();
  const sites = [...new Set(data.map((x) => x.site))].sort((a, b) => String(a).localeCompare(String(b), "fr"));
  if (!days.length || !sites.length) { box.innerHTML = emptyBox("Rien à comparer", "Il faut le Pipeline (Sheet) et au moins une synchro Blotato."); return; }
  const m = new Map(data.map((x) => [`${x.site}|${String(x.day).slice(0, 10)}`, x]));
  const isWe = (k) => { const w = dayDate(k).getUTCDay(); return w === 0 || w === 6; };
  const head = `<tr><th class="first" scope="col">Compte</th>${days.map((k) => { const [a, ...b] = fmtDayW(k).split(" "); return `<th class="c${isWe(k) ? " we" : ""}" scope="col" title="${esc(fmtDayLong(k))}">${esc(a)}<br>${esc(b.join(" "))}</th>`; }).join("")}</tr>`;
  const body = sites.map((s) => `<tr><td class="first"><span class="cell-main">${esc(s)}</span></td>${days.map((k) => {
    const x = m.get(`${s}|${k}`) || { sheet: 0, blotato: 0 };
    const sh = num(x.sheet), bl = num(x.blotato);
    const t = `${s} · ${fmtDayLong(k)} : ${sh} prévu(s) dans le Sheet, ${bl} programmé(s) chez Blotato`;
    if (!bl) return `<td class="c zero" title="${esc(t)}">${sh ? `${sh}/0` : "0"}</td>`;
    const diff = sh !== bl;
    return `<td class="c" style="background:color-mix(in srgb, var(${diff ? "--warn" : "--series-1"}) ${diff ? 30 : 24}%, var(--surface))" title="${esc(t)}">${diff ? `${sh}/${bl}` : bl}</td>`;
  }).join("")}</tr>`).join("");
  box.innerHTML = `<div class="tbl-wrap"><table class="tbl cal"><caption class="sr-only">Pins prévus dans le Sheet et programmés chez Blotato, par compte et par jour.</caption><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

const pinReload = () => { Store.drop("pin"); if (Router.view === "pinterest") Router.render({ silent: true, force: true }); };
async function pinSync(btn) {

async function pinMove(btn) {
  const cur = new Date(btn.dataset.at);
  const local = (d) => { const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
  const min = new Date(Date.now() + 5 * 60_000);
  const ok = await confirmDlg({ title: "Reprogrammer ce post", ok: "Reprogrammer",
    body: `<p class="small">Actuellement : <b>${esc(fmtAbs(btn.dataset.at))}</b></p>
      <label class="field" style="display:block;margin-top:10px">Nouvelle date et heure (heure de cet appareil)
        <input type="datetime-local" id="pin-move-at" value="${esc(local(isNaN(cur) ? min : cur))}" min="${esc(local(min))}" style="width:100%;margin-top:6px"></label>` });

}
