/* ═══════════ Vue d'ensemble ═══════════ */
/* ═══════════ Calendrier : un jour ou une période, partagé par toutes les vues ═══════════
   Choix gardé dans l'URL (#…&from=AAAA-MM-JJ&to=AAAA-MM-JJ) et dans la session : il suit quand on change d'onglet.
   Sans choix, chaque vue garde ses boutons « 7 j / 28 j / … » (jours glissants jusqu'à J-1). */
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
const dayDiff = (a, b) => Math.round((dayDate(b) - dayDate(a)) / 864e5);
const Period = {
  _s: (() => { try { const p = JSON.parse(sessionStorage.getItem("period") || "null"); return p && DAY_RE.test(p.from) && DAY_RE.test(p.to) ? p : null; } catch (_) { return null; } })(),
  _save(p) { this._s = p; try { p ? sessionStorage.setItem("period", JSON.stringify(p)) : sessionStorage.removeItem("period"); } catch (_) {} },
  /** Période choisie ({from,to}) ou null. L'URL prime ; sinon la session. */
  custom(params = Router.params) {
    const f = params?.from, t = params?.to;
    if (DAY_RE.test(f || "") && DAY_RE.test(t || "")) {
      const today = daysAgo(0);
      let a = f <= t ? f : t, b = f <= t ? t : f;
      if (b > today) b = today; if (a > b) a = b;
      const p = { from: a, to: b };
      if (!this._s || this._s.from !== a || this._s.to !== b) this._save(p);
      return p;
    }
    return this._s;
  },
  /** Choisit (p = {from,to}) ou efface (null) la période, puis recharge la vue. */
  set(p) {
    this._save(p);
    Router.setParams(p ? { from: p.from, to: p.to } : { from: null, to: null });
    Router.render({ force: false });
  },
  /** Efface sans recharger (clic sur un bouton « 7 j / 28 j » : la vue se recharge elle-même). */
  drop() { this._save(null); if (Router.params.from || Router.params.to) Router.setParams({ from: null, to: null }); },
  /** Fenêtre à afficher. d = jours glissants de la vue ; end = décalage de fin (1 = J-1 pour Google, 0 = aujourd'hui).
      cFrom/cTo = fenêtre des courbes : un seul jour → les ctx jours qui le précèdent, pour voir le contexte. */
  resolve(params, d, { end = 1, ctx = 28 } = {}) {
    const c = this.custom(params);
    if (!c) {
      const to = daysAgo(end), from = daysAgo(d + end - 1);
      return { custom: false, single: false, from, to, d, pfrom: addDays(from, -d), pto: addDays(from, -1), cFrom: from, cTo: to,
        label: `${d} derniers jours`, short: `${d} j`, vs: `vs ${d} j précédents` };
    }
    const n = dayDiff(c.from, c.to) + 1, single = n === 1;
    const y = (k) => (k.slice(0, 4) !== daysAgo(0).slice(0, 4) ? " " + k.slice(0, 4) : "");
    return {
      custom: true, single, from: c.from, to: c.to, d: n, pfrom: addDays(c.from, -n), pto: addDays(c.from, -1),
      cFrom: single ? addDays(c.to, -(ctx - 1)) : c.from, cTo: c.to,
      label: single ? fmtDayLong(c.from) : `${fmtDay(c.from)}${y(c.from)} → ${fmtDay(c.to)}${y(c.to)}`,
      short: single ? `${fmtDay(c.from)}${y(c.from)}` : `${fmtDay(c.from)} → ${fmtDay(c.to)}`,
      vs: single ? "vs la veille" : `vs les ${n} jours d'avant`,
    };
  },
  /** Bornes ISO (instant) d'une période en jours de Casablanca, pour filtrer des horodatages. */
  bounds(P) { return { gte: new Date(`${P.from}T00:00:00${TZ_OFF()}`).toISOString(), lt: new Date(`${addDays(P.to, 1)}T00:00:00${TZ_OFF()}`).toISOString() }; },
  /** Marqueur des courbes : le(s) jour(s) choisi(s). */
  marks(P, base = null) {
    if (!P.custom) return base;
    const m = { ...(base || {}) };
    for (let k = P.from; k <= P.to; k = addDays(k, 1)) m[k] = m[k] ? `${m[k]} · jour choisi` : "jour choisi";
    return m;
  },
  /** Bouton calendrier (à poser dans .filters). */
  ctl() {
    return `<div class="pcal" data-pcal>
      <button type="button" class="btn" data-pcal-open aria-haspopup="dialog" aria-expanded="false" title="Choisir un jour ou une période">${icon("cal")}<span data-pcal-label>Calendrier</span></button>
      <button type="button" class="btn icon ghost pcal-x" data-pcal-clear hidden aria-label="Revenir aux derniers jours" title="Revenir aux derniers jours">${icon("x")}</button>
    </div>`;
  },
  /** Met le bouton et les boutons « 7 j / 28 j » de la vue à jour. */
  paint(el, P, segSel) {
    $$("[data-pcal]", el).forEach((w) => {
      $("[data-pcal-label]", w).textContent = P.custom ? P.short : "Calendrier";
      $("[data-pcal-open]", w).classList.toggle("on", P.custom);
      $("[data-pcal-clear]", w).hidden = !P.custom;
    });
    if (segSel && P.custom) $$(`${segSel} button`, el).forEach((b) => b.setAttribute("aria-pressed", "false"));
  },
  _pop: null,
  _open(btn) {
    const P = this.custom(), today = daysAgo(0);
    let pop = this._pop;
    if (!pop) {
      pop = this._pop = document.createElement("div");
      pop.className = "pcal-pop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "Choisir un jour ou une période");
      document.body.appendChild(pop);
      pop.addEventListener("click", (e) => this._click(e));
      pop.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); this._close(true); } if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); this._apply(); } });
    }
    const mode = P && P.from !== P.to ? "range" : "day";
    const quick = [[1, "Hier"], [2, "Avant-hier"], [3, "J-3 (Google complet)"], [7, "Il y a 7 j"]];
    pop.innerHTML = `
      <div class="seg" data-pcal-mode role="group" aria-label="Mode"><button type="button" data-m="day" aria-pressed="${mode === "day"}">Un jour</button><button type="button" data-m="range" aria-pressed="${mode === "range"}">Une période</button></div>
      <div class="pcal-f">
        <label class="field"><span data-pcal-l1>${mode === "day" ? "Jour" : "Du"}</span><input type="date" data-pcal-from max="${today}" value="${esc(P?.from || daysAgo(1))}"></label>
        <label class="field" data-pcal-to-w ${mode === "day" ? "hidden" : ""}><span>Au</span><input type="date" data-pcal-to max="${today}" value="${esc(P?.to || daysAgo(1))}"></label>
      </div>
      <div class="chips">${quick.map(([n, t]) => `<button type="button" class="chip" data-pcal-q="${n}">${esc(t)}</button>`).join("")}<button type="button" class="chip" data-pcal-q="month">Ce mois-ci</button><button type="button" class="chip" data-pcal-q="lastmonth">Mois dernier</button></div>
      <p class="hint">Google (Search Console, GA4) publie avec 2-3 jours de retard : les jours les plus récents sont encore incomplets.</p>
      <div class="btn-row"><button type="button" class="btn primary" data-pcal-apply>Afficher</button><button type="button" class="btn ghost" data-pcal-cancel>Fermer</button>${P ? `<button type="button" class="btn ghost" data-pcal-reset>Revenir aux derniers jours</button>` : ""}</div>`;
    pop.hidden = false; pop._btn = btn; btn.setAttribute("aria-expanded", "true");
    const r = btn.getBoundingClientRect(), w = Math.min(340, window.innerWidth - 24);
    pop.style.width = w + "px";
    pop.style.left = Math.max(12, Math.min(r.right - w, window.innerWidth - w - 12)) + "px";
    pop.style.top = (r.bottom + window.scrollY + 6) + "px";
    setTimeout(() => $("[data-pcal-from]", pop)?.focus(), 20);
  },
  _close(focus) {
    const pop = this._pop; if (!pop || pop.hidden) return;
    pop.hidden = true; pop._btn?.setAttribute("aria-expanded", "false"); if (focus) pop._btn?.focus();
  },
  _mode(pop) { return $("[data-pcal-mode] [aria-pressed=\"true\"]", pop)?.dataset.m || "day"; },
  _apply() {
    const pop = this._pop, f = $("[data-pcal-from]", pop).value, single = this._mode(pop) === "day";
    const t = single ? f : $("[data-pcal-to]", pop).value;
    if (!DAY_RE.test(f) || !DAY_RE.test(t)) { toast("Choisis une date", { err: true }); return; }
    if (f > daysAgo(0) || t > daysAgo(0)) { toast("Date dans le futur : pas encore de données", { err: true }); return; }
    this._close(false);
    this.set(f <= t ? { from: f, to: t } : { from: t, to: f });
  },
  _click(e) {
    const pop = this._pop;
    const m = e.target.closest("[data-pcal-mode] button");
    if (m) {
      $$("[data-pcal-mode] button", pop).forEach((b) => b.setAttribute("aria-pressed", String(b === m)));
      const range = m.dataset.m === "range";
      $("[data-pcal-to-w]", pop).hidden = !range; $("[data-pcal-l1]", pop).textContent = range ? "Du" : "Jour";
      return;
    }
    const q = e.target.closest("[data-pcal-q]");
    if (q) {
      const v = q.dataset.pcalQ;
      if (v === "month" || v === "lastmonth") {
        const now = new Date(daysAgo(0) + "T12:00:00Z");
        const first = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - (v === "lastmonth" ? 1 : 0), 1));
        const last = v === "lastmonth" ? new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 0)) : new Date(daysAgo(0) + "T12:00:00Z");
        this._close(false); this.set({ from: iso(first), to: iso(last) });
      } else { const k = daysAgo(Number(v)); this._close(false); this.set({ from: k, to: k }); }
      return;
    }
    if (e.target.closest("[data-pcal-apply]")) return this._apply();
    if (e.target.closest("[data-pcal-cancel]")) return this._close(true);
    if (e.target.closest("[data-pcal-reset]")) { this._close(false); this.set(null); }
  },
  bind() {
    document.addEventListener("click", (e) => {
      const o = e.target.closest("[data-pcal-open]");
      if (o) { e.preventDefault(); this._pop && !this._pop.hidden && this._pop._btn === o ? this._close(true) : this._open(o); return; }
      if (e.target.closest("[data-pcal-clear]")) { this.set(null); return; }
      if (this._pop && !this._pop.hidden && !e.target.closest(".pcal-pop")) this._close(false);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && this._pop && !this._pop.hidden) this._close(true); });
    window.addEventListener("resize", () => this._close(false));
    Commands.register({ id: "pcal", label: "Choisir un jour (calendrier)", hint: "toutes les vues", run: () => { const b = $(`main.main > section[data-view="${Router.view}"] [data-pcal-open]`); if (b) b.click(); else toast("Pas de calendrier sur cette vue"); } });
    Commands.register({ id: "pcal-y", label: "Afficher hier", hint: "calendrier", run: () => { const k = daysAgo(1); this.set({ from: k, to: k }); } });
    Commands.register({ id: "pcal-clear", label: "Revenir aux derniers jours (effacer la date)", hint: "calendrier", run: () => this.set(null) });

/** Décalage horaire de Casablanca pour une date ISO « AAAA-MM-JJTHH:MM:SS±hh:mm ». */
function TZ_OFF() {
  try {
    const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, timeZoneName: "longOffset" }).formatToParts(new Date()).find((x) => x.type === "timeZoneName")?.value || "GMT";
    const m = p.match(/GMT([+-]\d{2}):?(\d{2})?/); return m ? `${m[1]}:${m[2] || "00"}` : "+00:00";
  } catch (_) { return "+00:00"; }
}

const OV_PERIODS = [{ d: 7, t: "7 j" }, { d: 28, t: "28 j" }, { d: 90, t: "3 m" }];

/* Repérage des workflows de la chaîne principale (les copies TENDANCE / JETABLE / tests sont exclues). */
const LINE_RE = {
  wf1: /\bwf\s*-?\s*1(?![0-9])/i,
  wf2a: /\bwf\s*-?\s*2\s*a(?![a-z0-9])/i,
  wf2b: /\bwf\s*-?\s*2\s*b(?![a-z0-9])/i,
  wf3a: /\bwf\s*-?\s*3\s*a(?![a-z0-9])/i,
  wf3b: /\bwf\s*-?\s*3\s*b(?![a-z0-9])/i,
};
const LINE_EXCLUDE = /tendance|jetable|\btest\b|copie|copy/i;
const wfFor = (wfs, re) => (wfs || []).filter((w) => re.test(w.name || "") && !LINE_EXCLUDE.test(w.name || ""));
function wfTone(list) {
  if (!list.length) return null;
  const act = list.filter((w) => w.active);
  if (!act.length) return "off";
  if (act.some((w) => isFailStatus(w.last_status))) return "crit";
  if (act.some((w) => num(w.running_now) > 0)) return "run";
  if (act.some((w) => num(w.errors_24h) > 0)) return "warn";
  if (act.some((w) => w.last_status === "success" || w.last_success)) return "ok";
  return "off";
}
const wfLabel = (w) => `${w.name} : ${!w.active ? "inactif" : num(w.running_now) > 0 ? "en cours" : isFailStatus(w.last_status) ? "dernière exécution en échec" : w.last_status === "success" ? "OK" : w.last_status || "aucune exécution"}${w.last_success ? `, dernier succès ${rel(w.last_success)}` : ""}`;

/** Construit les 7 stations de la ligne à partir du Sheet, de n8n, des services et du SEO. */
function buildLine({ row, wfs, hc, seo }) {
  const d = row?.data || null;
  const A = d?.articles || {}, I = d?.images || {}, P = d?.pins || {};
  const ab = A.byStatus || {}, ib = I.byStatus || {}, pb = P.byStatus || {};
  const imgFailed = Object.entries(ib).filter(([k]) => k.startsWith("failed")).reduce((n, [, v]) => n + num(v), 0);
  const failedUpload = num(ib.failed_upload);
  const failedGen = Math.max(0, imgFailed - failedUpload);
  const pod = (hc || []).filter((c) => c.enabled !== false && /pod|runpod|gpu/i.test(`${c.name} ${c.url}`));
  const podDown = pod.filter((c) => c.last_checked_at && !c.last_ok);
  const podOk = pod.length && pod.every((c) => c.last_ok);
  const near = (d?.nextDays || []).slice(0, 2);
  const pinSites = (P.bySite || []).filter((s) => s.site && s.site !== "—");
  const gap = near.length ? pinSites.filter((s) => near.every((k) => !num(P.cal?.[s.site]?.[k]))) : [];
  const metaTone = !row ? "off" : !row.ok ? "crit" : minutesSince(row.taken_at) > 45 ? "warn" : "ok";
  const has = !!d;
  const tab = (t) => ({ view: "pipeline", tab: t });

  const st = [
    { key: "sheet", name: "Sheet", role: "Master", go: tab("synth"), tone: metaTone,
      count: has ? fmt(A.total) : "—", unit: "au plan",
      stx: !row ? ["off", "pas encore lu"] : !row.ok ? ["crit", "lecture en échec"] : [metaTone === "warn" ? "warn" : "", `lu ${rel(row.taken_at)}`],
      title: row ? (row.ok ? `Sheet lu ${fmtAbs(row.taken_at)}` : `Dernière tentative ${fmtAbs(row.taken_at)} : ${row.error || "échec"}`) : "Pipeline jamais synchronisé" },
    { key: "wf1", name: "WF1", role: "Articles", go: tab("articles"), wf: LINE_RE.wf1,
      data: num(A.failed) ? "warn" : has ? "ok" : null,
      count: has ? fmt(A.published) : "—", unit: "publiés",
      stx: num(A.failed) ? ["warn", `${fmt(A.failed)} en échec`] : has ? ["", `${fmt(A.generated)} générés`] : null,
      queue: has ? { n: num(ab.pending) + num(ab.processing), label: "à écrire", title: "Articles en attente ou en cours d'écriture" } : null },
    { key: "wf2a", name: "WF2a", role: "Images GPU", go: tab("images"), wf: LINE_RE.wf2a,
      data: podDown.length ? "crit" : failedGen ? "warn" : has ? "ok" : null,
      count: has ? fmt(I.images) : "—", unit: "images",
      stx: podDown.length ? ["crit", "pod injoignable"] : failedGen ? ["warn", `${fmt(failedGen)} en échec`] : podOk ? ["ok", "pod en ligne"] : has ? ["", `${fmtDec(I.avg)} / article`] : null,
      queue: has ? { n: num(ib.pending), label: "sans image", title: "Articles prêts qui attendent leurs images" } : null,
      extraTitle: pod.map((c) => `${c.name} : ${c.last_ok ? "OK" : c.last_checked_at ? "injoignable" : "jamais vérifié"}`) },
    { key: "wf2b", name: "WF2b", role: "Upload WP", go: tab("images"), wf: LINE_RE.wf2b,
      data: failedUpload ? "warn" : has ? "ok" : null,
      count: has ? fmt(I.articlesDone) : "—", unit: "illustrés",
      stx: failedUpload ? ["warn", `${fmt(failedUpload)} envois en échec`] : has ? ["", `${fmt(num(ib.uploading))} en envoi`] : null,
      queue: has ? { n: num(ib.generated), label: "à envoyer", title: "Images générées, pas encore envoyées sur WordPress" } : null },
    { key: "wf3a", name: "WF3a", role: "Pins", go: tab("pins"), wf: LINE_RE.wf3a,
      data: num(pb.error) ? "warn" : has ? "ok" : null,
      count: has ? fmt(P.total) : "—", unit: "pins",
      stx: num(pb.error) ? ["warn", `${fmt(pb.error)} en erreur`] : has ? ["", `couverture ${pct(P.covered, P.published)}`] : null,
      queue: has ? { n: num(P.noPins), label: "sans pin", title: "Articles publiés qui n'ont encore aucun pin" } : null },
    { key: "wf3b", name: "WF3b", role: "Blotato", go: tab("planner"), wf: LINE_RE.wf3b,
      data: gap.length ? "warn" : has ? "ok" : null,
      count: has ? fmt(num(pb.posted) + num(pb.scheduled)) : "—", unit: "en ligne",
      stx: gap.length ? ["warn", `${plural(gap.length, "site", "sites")} sans pin sous 48 h`] : has ? ["", `${fmt(pb.planned)} planifiés`] : null,
      queue: has ? { n: num(pb.done) + num(pb.planned), label: "à publier", title: "Pins générés ou planifiés, pas encore envoyés à Blotato" } : null,
      extraTitle: gap.length ? [`Sans pin sous 48 h : ${gap.map((s) => s.site).join(", ")}`] : [] },
    { key: "traffic", name: "Trafic", role: "Google · Pinterest", go: { view: "seo" }, tone: seo.tone,
      count: seo.count, unit: "clics", stx: seo.stx, title: seo.title },
  ];
  return st.map((s) => {
    const list = s.wf ? wfFor(wfs, s.wf) : [];
    const wt = s.wf ? wfTone(list) : null;
    const tone = s.tone || worst(wt, s.data) || "off";
    let stx = s.stx;
    if (wt === "crit") stx = ["crit", "échec n8n"];
    else if (wt === "run" && (!stx || !stx[0])) stx = ["", "n8n en cours"];
    const titles = [s.title, ...list.map(wfLabel), ...(s.extraTitle || [])].filter(Boolean);
    if (s.wf && !list.length) titles.push(`Aucun workflow n8n dont le nom contient « ${s.name} »`);
    return { ...s, tone, stx, title: titles.join("\n"), wfList: list };
  });
}
function lineHtml(stations) {
  const toneTxt = { ok: "OK", warn: "à surveiller", crit: "en panne", run: "en cours", off: "sans donnée" };
  return `<ol class="ligne" style="--n:${stations.length}" aria-label="Ligne de production, de la feuille au trafic">${stations.map((s, i) => {
    const q = i > 0 && s.queue ? `<span class="q${s.queue.n ? (s.queue.n > 50 ? " hot" : "") : " zero"}" title="${esc(s.queue.title)}">${fmt(s.queue.n)} <span class="sr-only">${esc(s.queue.label)}</span></span>` : "";
    const href = Router.href(s.go.view, s.go.tab ? { tab: s.go.tab } : {});
    const stx = s.stx ? `<span class="stx ${s.stx[0] ? "t-" + (s.stx[0] === "ok" ? "good" : s.stx[0]) : ""}">${esc(s.stx[1])}</span>` : `<span class="stx muted">—</span>`;
    return `<li>${q}<a class="st" href="${href}" data-nav="${s.go.view}"${s.go.tab ? ` data-tab="${s.go.tab}"` : ""} title="${esc(s.title)}">
      <span class="sig">${lamp(s.tone)}</span>
      <span class="name">${esc(s.name)}</span><span class="role">${esc(s.role)}</span>
      <span class="count">${s.count}</span><span class="unit">${esc(s.unit)}</span>${stx}
      <span class="sr-only">État : ${toneTxt[s.tone] || s.tone}.${s.queue ? ` ${fmt(s.queue.n)} ${s.queue.label} avant cette étape.` : ""}</span>
    </a></li>`;
  }).join("")}</ol>`;
}

/* ═══════════ SEO (Search Console + GA4, façon gscdump) ═══════════ */
const SEO_PERIODS = [{ d: 7, t: "7 j" }, { d: 28, t: "28 j" }, { d: 90, t: "3 m" }, { d: 180, t: "6 m" }, { d: 365, t: "12 m" }, { d: 480, t: "16 m" }];
/* gsc_dims renvoie des codes pays ISO-3 en minuscules ; Intl.DisplayNames attend de l'ISO-2. */
const SEO_ISO3 = {
  deu: "DE", aut: "AT", che: "CH", fra: "FR", bel: "BE", lux: "LU", nld: "NL", ita: "IT", esp: "ES", pol: "PL",
  usa: "US", gbr: "GB", can: "CA", mar: "MA", dza: "DZ", tun: "TN", irl: "IE", dnk: "DK", swe: "SE", nor: "NO",
  fin: "FI", cze: "CZ", svk: "SK", hun: "HU", rou: "RO", bgr: "BG", hrv: "HR", svn: "SI", grc: "GR", prt: "PT",
  tur: "TR", rus: "RU", ukr: "UA", bra: "BR", mex: "MX", ind: "IN", aus: "AU", nzl: "NZ", jpn: "JP",
  lie: "LI", isl: "IS", est: "EE", lva: "LV", ltu: "LT", srb: "RS", bih: "BA", alb: "AL", mkd: "MK", mne: "ME",
  xkk: "XK", mlt: "MT", cyp: "CY", blr: "BY", mda: "MD", geo: "GE", arm: "AM", aze: "AZ", kaz: "KZ", mco: "MC",
  isr: "IL", are: "AE", sau: "SA", qat: "QA", kwt: "KW", egy: "EG", lby: "LY", lbn: "LB", jor: "JO", irn: "IR",
  irq: "IQ", zaf: "ZA", nga: "NG", sen: "SN", civ: "CI", cmr: "CM", ken: "KE", chn: "CN", kor: "KR", twn: "TW",
  hkg: "HK", sgp: "SG", tha: "TH", vnm: "VN", idn: "ID", phl: "PH", mys: "MY", pak: "PK", bgd: "BD",
  arg: "AR", chl: "CL", col: "CO", per: "PE", ven: "VE", ecu: "EC", ury: "UY", cri: "CR", dom: "DO",
};
const SEO_DEVICES = { MOBILE: "Mobile", DESKTOP: "Ordinateur", TABLET: "Tablette" };
/** Dernières lignes lues (les filtres des tables les relisent sans rappeler le serveur).
 *  lastSite : le site choisi survit aux changements de vue pendant la session (comme l'ancien front). */
const SEO_st = { v: null, q: null, p: null, lastSite: null };
let SEO_dn;

function SEO_country(v) {
  const k = String(v ?? "").trim().toLowerCase();
  if (!k || k === "zzz") return "Inconnu";
  const c2 = SEO_ISO3[k];
  if (c2) {
    if (SEO_dn === undefined) { try { SEO_dn = new Intl.DisplayNames(["fr"], { type: "region" }); } catch (_) { SEO_dn = null; } }
    try { const n = SEO_dn?.of(c2); if (n && n !== c2) return n; } catch (_) {}
  }
  return k.toUpperCase();
}
/** Rétention du détail quotidien (settings.gsc_daily_retention_days, défaut backend 90). */
function SEO_retention(rows) {
  const v = (rows || []).find((r) => r?.key === "gsc_daily_retention_days")?.value;
  const n = typeof v === "number" ? v : typeof v === "string" ? parseInt(v, 10) : NaN;
  return Number.isFinite(n) && n >= 0 ? Math.trunc(n) : 90;
}
const SEO_name = (s) => (s ? String(s.label || s.domain || "Site") : "Tous les sites suivis");
const SEO_norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
/* Un id de site vient du hash (lien partagé, saisie) : tout ce qui n'est pas un uuid ferait échouer chaque RPC. */
const SEO_UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const SEO_device = (v) => SEO_DEVICES[String(v ?? "").toUpperCase()] || (v ? String(v) : "—");
const SEO_href = (u) => (/^https?:\/\//i.test(String(u ?? "")) ? String(u) : null);
/** URL complète → chemin ; avec l'hôte (sans schéma ni www) quand tous les sites sont mélangés. */
const SEO_path = (u, withHost) => { const s = String(u ?? ""); return (withHost ? s.replace(/^https?:\/\/(www\.)?/i, "") : s.replace(/^https?:\/\/[^/]+/i, "")) || "/"; };
/** « mois complets d'août 2025 à octobre 2026 » (mois civils couverts par l'agrégat mensuel). */
function SEO_months(from, to) {
  const de = (m) => (/^[aeiouyéèêâàîïôûh]/i.test(m) ? `d'${m}` : `de ${m}`);
  const m1 = fmtMonth(from), m2 = fmtMonth(to);
  return from.slice(0, 7) === to.slice(0, 7) ? `mois complet ${de(m1)}` : `mois complets ${de(m1)} à ${m2}`;
}
function SEO_metrics(arr) {
  const clicks = sum(arr, "clicks"), impr = sum(arr, "impressions");
  return {
    clicks, impr, ctr: impr ? clicks / impr : null,
    pos: impr ? (arr || []).reduce((a, x) => a + num(x.avg_position) * num(x.impressions), 0) / impr : null,
    sessions: sum(arr, "sessions"), pin: sum(arr, "pinterest_sessions"),
  };
}
/** Variation relative du CTR, avec le CTR précédent lisible au survol (delta() l'arrondirait à 0). */
function SEO_dCtr(cur, prev) {
  const h = delta(cur, prev);
  if (numOrNull(cur) == null || numOrNull(prev) == null) return h;
  return h.replace(/ title="[^"]*"/, ` title="${esc(`Variation relative du CTR · période précédente : ${fmtPct(prev)}`)}"`);
}
function SEO_granHtml(g, v) {
  if (g !== "monthly") return `<span title="Search Console au jour près sur la période choisie">jour par jour</span>`;
  const t = `Au-delà de ${v.ret} jours, Search Console n'est gardé que par mois : ces chiffres couvrent des mois civils entiers (le dernier jusqu'au dernier jour synchronisé), donc plus que la période choisie.`;
  return `<span title="${esc(t)}">agrégé par mois (${esc(SEO_months(v.from, v.to))})</span>`;
}
function SEO_legend(el, id, items) {
  const lg = $(`#lg-${id}`, el); if (!lg) return;
  lg.hidden = !items.length;
  lg.innerHTML = items.map((l) => `<span><i style="background:var(${l.color})"></i>${esc(l.label)}</span>`).join("");
}
function SEO_setOpts(sel, html, val) {
  if (sel._h !== html) { sel.innerHTML = html; sel._h = html; }
  sel.value = val;
}
/** Top requêtes (k = "q") ou top pages (k = "p") : filtre sur toutes les lignes, barre de proportion, tri, CSV. */
function SEO_drawGsc(el, k) {
  const st = SEO_st[k], v = SEO_st.v;
  const box = $(`#seo-${k}-tbl`, el), meta = $(`#seo-${k}-meta`, el), inp = $(`#seo-${k}-f`, el);
  if (!st || !v || !box) return;
  if (!st.ok) { box._tbl = null; box.innerHTML = errBox(st.error); meta.textContent = ""; return; }
  const isQ = k === "q", key = isQ ? "query" : "page";
  const raw = inp.value.trim(), q = SEO_norm(raw);
  const list = q ? st.rows.filter((r) => SEO_norm(r[key]).includes(q)) : st.rows;
  const max = Math.max(1, ...list.map((r) => num(r.clicks)));
  const gran = SEO_granHtml(st.rows[0]?.granularity || (v.d <= v.ret ? "daily" : "monthly"), v);
  const n = st.rows.length;
  meta.innerHTML = n ? `${q ? `${fmtFull(list.length)} sur ` : ""}${plural(n, "ligne", "lignes")} · ${gran}` : gran;
  const withHost = !isQ && !v.siteId;
  const first = isQ
    ? { key: "query", label: "Requête", cls: "maxw", value: (r) => String(r.query ?? ""), render: (r) => `<span class="trunc" title="${esc(r.query)}">${esc(r.query)}</span>` }
    : { key: "page", label: "Page", cls: "maxw-s", value: (r) => SEO_path(r.page, withHost), csv: (r) => r.page,
        render: (r) => { const h = SEO_href(r.page), t = esc(SEO_path(r.page, withHost)); return h ? `<a class="trunc" href="${esc(h)}" target="_blank" rel="noopener" title="${esc(r.page)}">${t}</a>` : `<span class="trunc" title="${esc(r.page)}">${t}</span>`; } };
  mountTable(box, {
    id: "seo-" + k, csvName: `seo-${isQ ? "requetes" : "pages"}-${v.slug}`, rows: list, sort: { key: "clicks", dir: "desc" }, scrollY: true,
    empty: n ? emptyBox(isQ ? "Aucune requête trouvée" : "Aucune page trouvée", `Rien ne contient « ${esc(raw)} » sur cette période.`, `<button class="btn sm" type="button" data-seo-clear="${k}">Effacer le filtre</button>`) : st.empty,
    cols: [
      first,
      { key: "clicks", label: "Clics", r: 1, num: 1, cls: "bar-cell", value: (r) => num(r.clicks), csv: (r) => r.clicks,
        render: (r) => `<span class="b" style="--w:${(num(r.clicks) / max).toFixed(3)}"></span><span>${fmt(r.clicks)}</span>` },
      { key: "impressions", label: "Impr.", r: 1, num: 1, value: (r) => num(r.impressions), render: (r) => fmt(r.impressions) },
      { key: "ctr", label: "CTR (%)", th: "CTR", r: 1, num: 1, cls: "nowrap", value: (r) => numOrNull(r.ctr), csv: (r) => (numOrNull(r.ctr) == null ? "" : csvNum(num(r.ctr) * 100, 2)), render: (r) => fmtPct(r.ctr) },
      { key: "avg_position", label: "Position", th: "Pos.", r: 1, num: 1, firstDir: "asc", value: (r) => numOrNull(r.avg_position), csv: (r) => csvNum(r.avg_position, 1), render: (r) => fmtPos(r.avg_position) },
    ],
  });

    const ret = SEO_retention(r0.cfg.ok ? r0.cfg.data : null), gate = Math.floor(ret / 2);

    $("#seo-sub", el).innerHTML = `${lead}${P.single ? `<b>${esc(P.label)}</b> · comparé à la veille · 28 j de contexte sur les courbes` : `${fd(from)} → ${fd(to)} · comparé à ${fd(pfrom)} → ${fd(pto)}`} · ${dailyOk ? "requêtes et pages jour par jour" : `requêtes et pages agrégées par mois (au-delà de ${ret} j)`}${cfgWarn}`;

    /* 2. Données : chaque appel est indépendant (un bloc en erreur n'empêche pas les autres). */
    const base = { p_site: siteId, p_from: from, p_to: to };
    const r = await settle({
      cur: () => rpc("site_series", { p_site: siteId, p_from: from, p_to: to }),
      prev: () => rpc("site_series", { p_site: siteId, p_from: pfrom, p_to: pto }),
      cmp: () => (cmpOn ? rpc("site_series", { p_site: cmpId, p_from: from, p_to: to }) : Promise.resolve(null)),
      q: () => rpc("top_queries", { ...base, p_limit: 200 }),
      p: () => rpc("top_pages", { ...base, p_limit: 200 }),
      mv: () => (P.custom ? (pfrom >= daysAgo(ret) ? rpc("query_movers_range", { p_site: siteId, p_from: from, p_to: to, p_limit: 8 }) : Promise.resolve(null))
        : d <= gate ? rpc("query_movers", { p_site: siteId, p_days: d, p_limit: 8 }) : Promise.resolve(null)),
      chart: () => (P.single ? rpc("site_series", { p_site: siteId, p_from: P.cFrom, p_to: P.cTo }) : Promise.resolve(null)),
      cmpc: () => (P.single && cmpOn ? rpc("site_series", { p_site: cmpId, p_from: P.cFrom, p_to: P.cTo }) : Promise.resolve(null)),
      ctry: () => rpc("gsc_dims", { ...base, p_dim: "country", p_limit: 10 }),
      dev: () => rpc("gsc_dims", { ...base, p_dim: "device", p_limit: 5 }),
      src: () => rpc("ga4_sources", { ...base, p_limit: 12 }),
      gap: () => rpc("ga4_pages", { ...base, p_limit: 30 }),
    });
    if (!ctx.alive()) return;

    /* Contexte des états vides : aucun site suivi, propriété non liée, import pas encore fait. */
    const scope = siteId ? (A ? [A] : []) : tracked;
    const noTracked = known && !tracked.length;
    const hasGsc = !known || !scope.length || scope.some((s) => s.has_gsc);
    const hasGa4 = !known || !scope.length || scope.some((s) => s.has_ga4);
    const synced = !known || !scope.length || scope.some((s) => s.last_sync_at);
    const cxLink = `<a href="${Router.href("settings")}" data-nav="settings">Connexions</a>`;
    const cxBtn = `<a class="btn" href="${Router.href("settings")}" data-nav="settings">Ouvrir Connexions</a>`;
    const whose = siteId ? "Ce site n'a" : "Aucun site suivi n'a";
    const why = (kind) => {
      if (noTracked) return { title: "Aucun site suivi", text: `Connecte un compte Google puis active « Suivre » sur tes sites dans ${cxLink}.` };
      if (kind === "gsc" && !hasGsc) return { title: "Search Console non liée", text: `${whose} pas de propriété Search Console liée : choisis-la dans ${cxLink}.` };
      if (kind === "ga4" && !hasGa4) return { title: "GA4 non lié", text: `${whose} pas de propriété GA4 liée : choisis-la dans ${cxLink}.` };
      if (!synced) return { title: "Pas encore de données", text: `Les données arrivent après l'import de l'historique (${cxLink} → Importer l'historique).` };
      return { title: "Rien sur cette période", text: `${d < 480 ? "Essaie une période plus longue. " : ""}Site récent ? Les données arrivent après l'import de l'historique (${cxLink} → Importer l'historique).` };
    };
    const emptyHtml = (kind) => { const w = why(kind); return emptyBox(w.title, w.text, noTracked ? cxBtn : ""); };
    SEO_st.v = { d, from, to, ret, siteId, slug: (A?.domain || "tous-les-sites").replace(/[^a-z0-9.-]+/gi, "-") };
    const blk = (sel, f) => { try { f(); } catch (e) { console.error(e); const b = $(sel, el); if (b) { b._tbl = null; b.innerHTML = errBox(e); } } };

    /* Bandeau */
    blk("#seo-banner", () => {
      let h = "";
      if (!known) h = `<div class="banner crit" role="alert"><div class="t"><b>Liste des sites indisponible</b><span class="small">${esc(r0.sites.error?.message || "Erreur inconnue")}</span></div><button class="btn sm" type="button" data-reload>Réessayer</button></div>`;
      else if (noTracked) h = `<div class="banner warn"><div class="t"><b>Aucun site suivi</b><span class="small">Le SEO lit Search Console et GA4 des sites marqués « Suivre ». Connecte un compte Google, active « Suivre » sur tes sites, puis lance « Importer l'historique ».</span></div>${cxBtn}</div>`;
      else {
        const errs = scope.filter((s) => s.last_sync_error);
        if (errs.length) h = `<div class="banner warn" role="status"><div class="t"><b>${errs.length > 1 ? `${errs.length} synchros en erreur` : "Dernière synchro en erreur"}</b><span class="small">${errs.slice(0, 3).map((s) => `${esc(s.domain)} : ${esc(String(s.last_sync_error).slice(0, 160))}`).join(" · ")}</span><div class="hint">Les chiffres peuvent être incomplets. Vérifie le compte Google et les liaisons dans ${cxLink}.</div></div></div>`;
      }
      $("#seo-banner", el).innerHTML = h;
    });

    /* KPI */
    const cur = r.cur.ok ? r.cur.data || [] : [];
    const m = SEO_metrics(cur), pm = r.prev.ok ? SEO_metrics(r.prev.data || []) : {};
    const cm = cmpOn && r.cmp.ok && r.cmp.data ? SEO_metrics(r.cmp.data) : null;
    blk("#seo-kpis", () => {
      const kb = $("#seo-kpis", el);
      if (!r.cur.ok) { kb.innerHTML = panel({ body: errBox(r.cur.error) }); return; }
      const cx = (t) => `<a href="${Router.href("settings")}" data-nav="settings">${t}</a>`;
      const gOff = noTracked ? cx("connecter Google") : !hasGsc ? cx("lier Search Console") : "";
      const aOff = noTracked ? cx("connecter Google") : !hasGa4 ? cx("lier GA4") : "";
      const gDash = noTracked || !hasGsc, aDash = noTracked || !hasGa4;
      const bShort = esc(B?.domain || bLeg);
      /* Valeur du site comparé ; « non lié » si B n'a pas la propriété (GSC ou GA4) correspondante. */
      const vs = (f, kind = "gsc") => !cmpOn ? ""
        : B && !(kind === "ga4" ? B.has_ga4 : B.has_gsc) ? `<span title="${esc(bLeg)} n'a pas de propriété ${kind === "ga4" ? "GA4" : "Search Console"} liée">${bShort} : ${kind === "ga4" ? "GA4" : "GSC"} non lié</span>`
        : cm ? `<span title="${esc(bLeg)} sur la même période">${bShort} : ${f(cm)}</span>`
        : `<span class="t-crit" title="${esc(r.cmp.ok ? "" : r.cmp.error?.message || "")}">${bShort} : indisponible</span>`;
      const join = (...a) => a.filter(Boolean).join(" ");
      /* Période précédente illisible : pas de delta trompeur, et l'erreur reste visible sous la rangée. */
      const prevErr = r.prev.ok ? "" : r.prev.error?.message || String(r.prev.error || "erreur inconnue");
      const dl = (on, h) => (!on ? "" : prevErr ? `<span class="delta flat" title="${esc(`Période précédente illisible : ${prevErr}`)}">—</span>` : h);
      kb.innerHTML = kpis([
        kpi({ label: "Clics", value: gDash ? "—" : fmt(m.clicks), title: gDash ? "" : fmtFull(m.clicks), delta: dl(!gDash, delta(m.clicks, pm.clicks)), sub: join(gOff, vs((x) => fmt(x.clicks))) }),
        kpi({ label: "Impressions", value: gDash ? "—" : fmt(m.impr), title: gDash ? "" : fmtFull(m.impr), delta: dl(!gDash, delta(m.impr, pm.impr)), sub: vs((x) => fmt(x.impr)) }),
        kpi({ label: "CTR", value: gDash ? "—" : fmtPct(m.ctr), delta: dl(!gDash, SEO_dCtr(m.ctr, pm.ctr)), sub: vs((x) => fmtPct(x.ctr)) }),
        kpi({ label: "Position moyenne", value: gDash ? "—" : fmtPos(m.pos), delta: dl(!gDash, delta(m.pos, pm.pos, { invert: true, abs: true })), sub: vs((x) => fmtPos(x.pos)) || (gDash ? "" : "plus bas = mieux"), title: "Moyenne pondérée par les impressions" }),
        kpi({ label: "Sessions GA4", value: aDash ? "—" : fmt(m.sessions), title: aDash ? "" : fmtFull(m.sessions), delta: dl(!aDash, delta(m.sessions, pm.sessions)), sub: join(aOff, vs((x) => fmt(x.sessions), "ga4")) }),
        kpi({ label: "Sessions Pinterest", value: aDash ? "—" : fmt(m.pin), title: aDash ? "" : fmtFull(m.pin), delta: dl(!aDash, delta(m.pin, pm.pin)), sub: vs((x) => fmt(x.pin), "ga4") || (!aDash && m.sessions ? `${pct(m.pin, m.sessions)} des sessions` : "") }),
      ]) + (prevErr ? `<p class="hint" role="alert"><span class="t-crit">Comparaison indisponible</span> : ${esc(prevErr)} <button class="btn sm" type="button" data-reload>Réessayer</button></p>` : "");
    });

    /* Graphiques (un axe Y chacun ; comparaison : site A en --series-1, site B en --series-3) */
    const gscCharts = ["seo-clicks", "seo-impr", "seo-pos"];
    if (!r.cur.ok) {
      [...gscCharts, "seo-sessions"].forEach((id) => { Charts.error(id, r.cur.error); $(`#meta-${id}`, el).textContent = id === "seo-pos" ? "plus bas = mieux" : ""; });
      gscCharts.forEach((id) => SEO_legend(el, id, []));
    } else {
      const ch = P.single && r.chart.ok ? r.chart.data || [] : cur;
      const cmpRows = P.single ? r.cmpc : r.cmp;
      const labels = ch.map((x) => x.date);
      const bRows = cmpOn && cmpRows.ok && Array.isArray(cmpRows.data) ? new Map(cmpRows.data.map((x) => [x.date, x])) : null;
      const gEmpty = why("gsc"), aEmpty = why("ga4");
      const series = (key, label) => {
        const s = [{ label: bRows ? aLeg : label, data: ch.map((x) => x[key]), color: "--series-1", fill: !bRows && key !== "avg_position" }];
        if (bRows) s.push({ label: bLeg, data: labels.map((k) => bRows.get(k)?.[key] ?? null), color: "--series-3" });
        return s;
      };
      const leg = bRows ? [{ label: aLeg, color: "--series-1" }, { label: bLeg, color: "--series-3" }] : [];
      const cmpErr = cmpOn && !r.cmp.ok ? ` · <span class="t-crit" title="${esc(r.cmp.error?.message || "")}">comparaison indisponible</span>` : "";
      blk("#box-seo-clicks", () => {
        Charts.line("seo-clicks", { title: "Clics", labels, series: series("clicks", "Clics"), lag: !P.custom, empty: gEmpty });
        $("#meta-seo-clicks", el).innerHTML = m.clicks ? `<span title="Google publie ses données avec 2 à 3 jours de retard : les derniers jours remontent encore.">${fmt(m.clicks)} ${P.single ? "ce jour-là" : "au total"} · derniers jours incomplets</span>${cmpErr}` : cmpErr;
      });
      blk("#box-seo-impr", () => {
        Charts.line("seo-impr", { title: "Impressions", labels, series: series("impressions", "Impressions"), lag: !P.custom, empty: gEmpty });
        $("#meta-seo-impr", el).innerHTML = m.impr ? `${fmt(m.impr)} au total${cmpErr}` : cmpErr;
      });
      blk("#box-seo-pos", () => {
        Charts.line("seo-pos", { title: "Position moyenne", labels, series: series("avg_position", "Position"), pos: true, empty: gEmpty });
        $("#meta-seo-pos", el).innerHTML = `plus bas = mieux${m.pos != null ? ` · moy. ${fmtPos(m.pos)}` : ""}${cmpErr}`;
      });
      gscCharts.forEach((id) => SEO_legend(el, id, leg));
      blk("#box-seo-sessions", () => {
        Charts.line("seo-sessions", { title: "Sessions GA4", labels, series: [{ label: "Toutes sources", data: ch.map((x) => x.sessions), color: "--series-1" }, { label: "Pinterest", data: ch.map((x) => x.pinterest_sessions), color: "--series-2" }], lag: !P.custom, empty: aEmpty });
        $("#meta-seo-sessions", el).innerHTML = m.sessions ? `${fmt(m.sessions)} sessions · ${fmt(m.pin)} Pinterest${cmpOn ? ` · ${esc(aLeg)} seulement` : ""}` : "";
      });
    }

    /* Top requêtes / top pages */
    SEO_st.q = r.q.ok ? { ok: true, rows: r.q.data || [], empty: emptyHtml("gsc") } : { ok: false, error: r.q.error };
    SEO_st.p = r.p.ok ? { ok: true, rows: r.p.data || [], empty: emptyHtml("gsc") } : { ok: false, error: r.p.error };
    blk("#seo-q-tbl", () => SEO_drawGsc(el, "q"));
    blk("#seo-p-tbl", () => SEO_drawGsc(el, "p"));

    /* Gagnants / perdants (détail quotidien seulement : période ≤ rétention / 2) */
    blk("#seo-mv", () => {
      const box = $("#seo-mv", el), meta = $("#seo-mv-meta", el);
      if (!r.mv.ok) { meta.textContent = ""; box.innerHTML = errBox(r.mv.error); return; }
      if (r.mv.data == null) {
        meta.textContent = "";
        const alt = [...SEO_PERIODS].reverse().find((p) => p.d <= gate);
        box.innerHTML = P.custom ? emptyBox("Détail quotidien indisponible", `Les requêtes jour par jour ne sont gardées que ${ret} jours : choisis une période plus récente.`) : emptyBox("Période trop longue", gate >= 1 ? `Disponible jusqu'à ${plural(gate, "jour", "jours")} (détail quotidien).` : `Le détail quotidien n'est pas conservé (rétention réglée à ${ret} j dans ${cxLink}).`,
          alt ? `<button class="btn sm" type="button" data-seo-d="${alt.d}">Passer à ${alt.t}</button>` : "");
        return;
      }
      meta.innerHTML = P.custom ? `${esc(P.short)} ${esc(P.vs)}` : `<span title="Fenêtre jusqu'à aujourd'hui inclus, comparée aux ${d} jours d'avant (les KPI s'arrêtent à J-1).">${d} j vs ${d} j précédents</span>`;
      const list = r.mv.data || [];
      const win = list.filter((x) => num(x.delta) > 0), lose = list.filter((x) => num(x.delta) < 0);
      if (!win.length && !lose.length) {
        box.innerHTML = noTracked || !hasGsc || !synced ? emptyHtml("gsc") : emptyBox("Aucun mouvement", "Aucune requête n'a gagné ni perdu de clics sur la période.");
        return;
      }
      const tbl = (rows, up) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>
          <th class="first" scope="col"><span class="${up ? "t-good" : "t-crit"}">${up ? "▲" : "▼"}</span> ${up ? "Gagnants" : "Perdants"}</th>
          <th class="r" scope="col">Clics</th><th class="r last" scope="col">Δ clics</th></tr></thead><tbody>
        ${rows.length ? rows.map((x) => `<tr><td class="first maxw-s"><span class="trunc" title="${esc(x.query)}">${esc(x.query)}</span></td>
          <td class="r num" title="Période précédente : ${esc(fmtFull(x.clicks_prev))}">${fmt(x.clicks_now)}</td>
          <td class="r num last"><span class="delta ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${fmt(Math.abs(num(x.delta)))}</span></td></tr>`).join("")
          : `<tr><td class="first last muted" colspan="3">${up ? "Aucune requête en hausse" : "Aucune requête en baisse"}</td></tr>`}
        </tbody></table></div>`;
      box.innerHTML = tbl(win, true) + tbl(lose, false);
    });

    /* Pays */
    blk("#seo-ctry", () => {
      const box = $("#seo-ctry", el);
      if (!r.ctry.ok) { box._tbl = null; box.innerHTML = errBox(r.ctry.error); return; }
      const rows = r.ctry.data || [], max = Math.max(1, ...rows.map((x) => num(x.clicks)));
      mountTable(box, {
        id: "seo-ctry", rows, sort: { key: "clicks", dir: "desc" }, empty: emptyHtml("gsc"),
        cols: [
          { key: "value", label: "Pays", value: (x) => SEO_country(x.value), csv: (x) => SEO_country(x.value), render: (x) => `<span title="${esc(String(x.value ?? "").toUpperCase())}">${esc(SEO_country(x.value))}</span>` },
          { key: "clicks", label: "Clics", r: 1, num: 1, cls: "bar-cell", value: (x) => num(x.clicks), render: (x) => `<span class="b" style="--w:${(num(x.clicks) / max).toFixed(3)}"></span><span>${fmt(x.clicks)}</span>` },
          { key: "impressions", label: "Impr.", r: 1, num: 1, value: (x) => num(x.impressions), render: (x) => fmt(x.impressions) },
          { key: "avg_position", label: "Pos.", r: 1, num: 1, firstDir: "asc", value: (x) => numOrNull(x.avg_position), render: (x) => fmtPos(x.avg_position) },
        ],
      });
    });

    /* Appareils */
    blk("#seo-dev", () => {
      const box = $("#seo-dev", el);
      if (!r.dev.ok) { box._tbl = null; box.innerHTML = errBox(r.dev.error); return; }
      const rows = r.dev.data || [], tot = sum(rows, "clicks");
      const share = (x) => (tot ? num(x.clicks) / tot : null);
      mountTable(box, {
        id: "seo-dev", rows, sort: { key: "clicks", dir: "desc" }, empty: emptyHtml("gsc"),
        cols: [
          { key: "value", label: "Appareil", value: (x) => SEO_device(x.value), render: (x) => esc(SEO_device(x.value)) },
          /* Clics + part des clics dans la même cellule (la barre = la part, absolue) : 4 colonnes tiennent dans un tiers de largeur. */
          { key: "clicks", label: "Clics", r: 1, num: 1, cls: "bar-cell nowrap", value: (x) => num(x.clicks),
            render: (x) => `<span class="b" style="--w:${(share(x) ?? 0).toFixed(3)}"></span><span>${fmt(x.clicks)}${share(x) == null ? "" : ` <span class="muted" title="Part des clics Google">${fmtPct(share(x), 0)}</span>`}</span>` },
          { key: "impressions", label: "Impr.", r: 1, num: 1, value: (x) => num(x.impressions), render: (x) => fmt(x.impressions) },
          { key: "avg_position", label: "Pos.", r: 1, num: 1, firstDir: "asc", value: (x) => numOrNull(x.avg_position), render: (x) => fmtPos(x.avg_position) },
        ],
      });
    });

    /* Sources GA4 (Pinterest mis en évidence : pastille --series-2 + étiquette) */
    blk("#seo-src", () => {
      const box = $("#seo-src", el), meta = $("#seo-src-meta", el);
      if (!r.src.ok) { meta.textContent = ""; box._tbl = null; box.innerHTML = errBox(r.src.error); return; }
      const rows = r.src.data || [], max = Math.max(1, ...rows.map((x) => num(x.sessions)));
      const isPin = (x) => /pinterest/i.test(String(x.source ?? ""));
      const pinS = sum(rows.filter(isPin), "sessions"), totS = sum(rows, "sessions");
      meta.innerHTML = rows.length ? `top 12 · Pinterest ${pct(pinS, totS)} des sessions listées` : "";
      mountTable(box, {
        id: "seo-src", rows, sort: { key: "sessions", dir: "desc" }, empty: emptyHtml("ga4"),
        cols: [
          { key: "source", label: "Source / support", value: (x) => `${x.source ?? ""} / ${x.medium ?? ""}`,
            render: (x) => { const p = isPin(x); return `${p ? `<i class="seo-key" aria-hidden="true"></i>` : ""}<span class="${p ? "cell-main" : ""}">${esc(x.source || "(direct)")}</span> <span class="muted">/ ${esc(x.medium || "—")}</span>${p ? ` <span class="tag">Pinterest</span>` : ""}`; } },
          { key: "sessions", label: "Sessions", r: 1, num: 1, cls: "bar-cell", value: (x) => num(x.sessions), render: (x) => `<span class="b" style="--w:${(num(x.sessions) / max).toFixed(3)}"></span><span>${fmt(x.sessions)}</span>` },
          { key: "users", label: "Utilisateurs", th: `<span title="Somme des utilisateurs de chaque jour, pas des visiteurs uniques">Utilisateurs</span>`, r: 1, num: 1, value: (x) => num(x.users), render: (x) => fmt(x.users) },
        ],
      });
    });

    /* Pages GA4 (toujours agrégées par mois civils) */
    blk("#seo-gap-tbl", () => {
      const box = $("#seo-gap-tbl", el), meta = $("#seo-gap-meta", el);
      const t = "GA4 ne garde les pages que par mois : ces chiffres couvrent des mois civils entiers (le dernier jusqu'au dernier jour synchronisé), pas exactement la période choisie.";
      meta.innerHTML = `<span title="${esc(t)}">agrégé par mois · ${esc(SEO_months(from, to))}</span>`;
      if (!r.gap.ok) { box._tbl = null; box.innerHTML = errBox(r.gap.error); return; }
      const rows = r.gap.data || [], max = Math.max(1, ...rows.map((x) => num(x.views)));
      const host = A && /^[a-z0-9.-]+$/i.test(String(A.domain || "")) ? A.domain : null;
      mountTable(box, {
        id: "seo-gap", csvName: `seo-pages-ga4-${SEO_st.v.slug}`, rows, sort: { key: "views", dir: "desc" }, empty: emptyHtml("ga4"),
        cols: [
          { key: "page", label: "Page", cls: "maxw", value: (x) => String(x.page ?? ""),
            render: (x) => { const p = String(x.page ?? ""); return host && p.startsWith("/") ? `<a class="trunc" href="${esc(`https://${host}${p}`)}" target="_blank" rel="noopener" title="${esc(host + p)}">${esc(p)}</a>` : `<span class="trunc" title="${esc(p)}">${esc(p || "—")}</span>`; } },
          { key: "views", label: "Vues", r: 1, num: 1, cls: "bar-cell", value: (x) => num(x.views), csv: (x) => x.views, render: (x) => `<span class="b" style="--w:${(num(x.views) / max).toFixed(3)}"></span><span>${fmt(x.views)}</span>` },
          { key: "sessions", label: "Sessions", r: 1, num: 1, value: (x) => num(x.sessions), render: (x) => fmt(x.sessions) },
        ],
      });
    });
  },
};

/* ═══════════ Ops n8n ═══════════
   Workflows (workflow_health), exécutions (n8n_executions), santé des services (health_checks), alertes.
   Écritures : n8n_workflows {watch} / {expected_every_min} ; health_checks insert / delete
   (+ résolution de l'alerte orpheline health:<id>) ; alerts {resolved_at} (bouton câblé dans core). */
const OPS_SUB_DEFAULT = "Workflows, exécutions, santé des services, alertes";
const OPS_SECRETS_URL = `https://supabase.com/dashboard/project/${new URL(SUPABASE_URL).hostname.split(".")[0]}/functions/secrets`;
const OPS_MODES = { trigger: "Auto", webhook: "Webhook", manual: "Manuel", retry: "Relance", integrated: "Sous-workflow", cli: "CLI", internal: "Interne", error: "Workflow d'erreur", evaluation: "Évaluation" };
const OPS_RANK = { crit: 0, warn: 1, run: 2, ok: 3, off: 4 };
const OpsState = {
  loaded: false, wfs: [], wfErr: null, byId: new Map(), hcById: new Map(), alerts: [], status: null,
  q: "", showInactive: lsGet("ops_inactive", "1") !== "0",
  pending: 0, syncing: false,
};
const opsNorm = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const opsTags = (w) => (Array.isArray(w?.tags) ? w.tags : []).map((t) => (t && typeof t === "object" ? t.name : t)).filter((t) => t != null && t !== "").map(String);

/** Statut d'exécution n8n → [ton, libellé]. */
function opsExecState(s) {
  switch (s) {
    case "success": return ["ok", "OK"];
    case "error": case "crashed": return ["crit", "Échec"];
    case "running": return ["run", "En cours"];
    case "waiting": return ["run", "En attente"];
    case "new": return ["run", "En file"];
    case "canceled": return ["off", "Annulé"];
    case "unknown": return ["warn", "Inconnu"];
    case null: case undefined: case "": return ["off", "Sans statut"];
    default: return ["warn", String(s)];
  }
}
/** État d'un workflow : inactif > en cours > dernier statut. */
function opsWfState(w) {
  if (!w.active) return ["off", "Inactif"];
  if (num(w.running_now) > 0) return ["run", "En cours"];
  if (w.last_status == null || w.last_status === "") return ["off", "Pas d'exécution"];
  return opsExecState(w.last_status);
}
/** Tri par défaut : en échec d'abord, inactifs en dernier. */
const opsWfRank = (w) => (!w.active ? 5 : OPS_RANK[opsWfState(w)[0]] ?? 4);
/** Aucun succès depuis plus de 2 × « Attendu » (règle de l'alerte wf_stale). */
const opsLate = (w) => { const e = num(w.expected_every_min); return !!w.active && e > 0 && minutesSince(w.last_success) > 2 * e; };
const opsMin = (m) => `${fmtFull(m)} min${m >= 60 ? ` (${dur(m * 60)})` : ""}`;

/** État d'un service → [ton, libellé, rang de tri, infobulle]. */
function opsHcState(c) {
  const chk = c.last_checked_at ? `Vérifié ${fmtAbs(c.last_checked_at)}` : "";
  const err = c.last_error ? ` · ${c.last_error}` : "";
  if (c.enabled === false) return ["off", "Désactivé", 3, "Désactivé : ce service n'est plus vérifié"];
  if (!c.last_checked_at) return ["off", "En attente", 1, "Pas encore vérifié : prochain passage dans 5 min au plus"];
  if (c.last_ok) return ["ok", "OK", 2, `${chk} · HTTP ${c.last_status ?? c.expect_status ?? 200}`];
  if (c.last_status) return ["crit", `HTTP ${c.last_status}`, 0, `${chk} · attendu HTTP ${c.expect_status ?? 200}${err}`];
  return ["crit", "Injoignable", 0, `${chk}${err || " · délai dépassé (12 s) ou erreur réseau"}`];
}
function opsExecDur(e) {
  const a = e.started_at ? new Date(e.started_at).getTime() : NaN;
  const b = e.stopped_at ? new Date(e.stopped_at).getTime() : NaN;
  return Number.isFinite(a) && Number.isFinite(b) && b >= a ? (b - a) / 1000 : null;
}

/* ─── Colonnes ─── */
const OPS_WF_COLS = [
  { key: "state", label: "État", firstDir: "asc", value: (w) => `${opsWfRank(w)}|${w.name || ""}`, csv: (w) => opsWfState(w)[1],

  { key: "name", label: "Workflow", value: (w) => w.name || "", csv: (w) => { const t = opsTags(w), n = w.name || w.id; return t.length ? `${n} [${t.join(", ")}]` : n; },
    render: (w) => { const t = opsTags(w); return `<span class="cell-main">${esc(w.name || w.id)}</span>${t.length ? `<span class="tags" style="margin-top:4px">${t.map((x) => `<span class="tag">${esc(x)}</span>`).join("")}</span>` : ""}`; } },
  { key: "last_started", label: "Dernière exéc.", firstDir: "desc", cls: "nowrap", value: (w) => w.last_started || null, csv: (w) => w.last_started || "", render: (w) => when(w.last_started) },
  { key: "last_success", label: "Dernier succès", firstDir: "desc", value: (w) => w.last_success || null, csv: (w) => w.last_success || "",
    cls: (w) => (opsLate(w) ? "t-warn" : ""),

  { key: "errors_24h", label: "Échecs 24 h", r: 1, num: 1, firstDir: "desc", value: (w) => num(w.errors_24h), csv: (w) => `${num(w.errors_24h)}/${num(w.runs_24h)}`,
    cls: (w) => (num(w.errors_24h) > 0 ? "hot" : ""), render: (w) => `${fmtFull(num(w.errors_24h))}<span class="muted"> / ${fmtFull(num(w.runs_24h))}</span>` },
  { key: "errors_7d", label: "7 j", r: 1, num: 1, firstDir: "desc", value: (w) => num(w.errors_7d), csv: (w) => `${num(w.errors_7d)}/${num(w.runs_7d)}`,
    render: (w) => `${fmtFull(num(w.errors_7d))}<span class="muted"> / ${fmtFull(num(w.runs_7d))}</span>` },

  { key: "watch", label: "Surveiller", firstDir: "desc", value: (w) => (w.watch ? 1 : 0), csv: (w) => (w.watch ? "oui" : "non"),
    render: (w) => `<label class="toggle" title="${w.watch ? "Surveillé : alertes actives" : "Non surveillé : aucune alerte"}"><input type="checkbox" data-watch="${esc(w.id)}"${w.watch ? " checked" : ""} aria-label="Surveiller ${esc(w.name)}"><span></span></label>` },
  { key: "expected_every_min", label: "Attendu (min)", th: `<span title="Minutes maximum entre deux succès : alerte après 2 × ce délai sans succès. Vide = pas de contrôle.">Attendu (min)</span>`,
    value: (w) => numOrNull(w.expected_every_min), csv: (w) => w.expected_every_min ?? "",
    render: (w) => `<input type="number" class="sm" min="0" step="5" inputmode="numeric" data-exp="${esc(w.id)}" data-orig="${esc(w.expected_every_min ?? "")}" value="${esc(w.expected_every_min ?? "")}" placeholder="—" aria-label="Minutes attendues entre deux succès pour ${esc(w.name)}" style="width:84px">` },
];
const OPS_HC_COLS = [
  { key: "name", label: "Service", value: (c) => c.name || "", csv: (c) => c.name,
    render: (c) => `<span class="cell-main">${esc(c.name)}</span>${c.enabled === false ? ` <span class="tag">désactivé</span>` : ""}<span class="cell-sub trunc mono" style="max-width:180px" title="${esc(c.url)}">${esc(c.url)}</span>` },
  { key: "state", label: "État", firstDir: "asc", value: (c) => `${opsHcState(c)[2]}|${c.name || ""}`, csv: (c) => opsHcState(c)[1],
    render: (c) => { const s = opsHcState(c); return `${stateTag(s[0], s[1], s[3])}${c.last_checked_at ? `<span class="cell-sub nowrap">vérifié ${when(c.last_checked_at)}</span>` : ""}`; } },
  { key: "last_ms", label: "Temps", r: 1, num: 1, cls: "nowrap", value: (c) => numOrNull(c.last_ms), csv: (c) => c.last_ms ?? "",
    render: (c) => (numOrNull(c.last_ms) == null ? `<span class="muted">—</span>` : `${fmtFull(c.last_ms)} ms`) },

  { key: "del", label: "", th: `<span class="sr-only">Actions</span>`, sort: false, csv: false, r: 1,
    render: (c) => `<button class="btn sm ghost danger" type="button" data-del-hc="${esc(c.id)}" aria-label="Retirer ${esc(c.name)}">Retirer</button>` },
];
const opsExCols = (names) => [
  { key: "wf", label: "Workflow", value: (e) => names.get(String(e.workflow_id)) || String(e.workflow_id ?? ""), csv: (e) => names.get(String(e.workflow_id)) || e.workflow_id,
    render: (e) => { const n = names.get(String(e.workflow_id)); return n ? `<span class="trunc" style="max-width:180px" title="${esc(n)}">${esc(n)}</span>` : `<span class="mono muted" title="Workflow absent de la liste synchronisée">${esc(e.workflow_id ?? "—")}</span>`; } },
  { key: "status", label: "Statut", value: (e) => OPS_RANK[opsExecState(e.status)[0]] ?? 4, csv: (e) => e.status || "",
    render: (e) => { const [t, l] = opsExecState(e.status); return stateTag(t, l, `Statut n8n : ${e.status || "aucun"} · exécution ${e.id}`); } },
  { key: "mode", label: "Mode", value: (e) => e.mode || "", csv: (e) => e.mode || "",
    render: (e) => (e.mode ? `<span title="${esc(e.mode)}">${esc(OPS_MODES[e.mode] || e.mode)}</span>` : `<span class="muted">—</span>`) },
  { key: "started_at", label: "Début", firstDir: "desc", cls: "nowrap", value: (e) => e.started_at || null, csv: (e) => e.started_at || "", render: (e) => when(e.started_at) },
  { key: "dur", label: "Durée", r: 1, num: 1, cls: "nowrap", value: (e) => opsExecDur(e), csv: (e) => csvNum(opsExecDur(e), 1),
    render: (e) => {
      const d = opsExecDur(e);
      if (d != null) return dur(d);
      if (!e.stopped_at && e.started_at && ["running", "waiting", "new"].includes(e.status)) return `<span class="muted" title="Toujours en cours : durée écoulée">${dur((Date.now() - new Date(e.started_at).getTime()) / 1000)}</span>`;
      return `<span class="muted">—</span>`;
    } },
];

/* ─── Rendus des blocs ─── */
function opsHead(el, r) {
  const st = r.st.ok ? r.st.data : null;
  const wfs = r.wf.ok ? r.wf.data : [];
  const execs = r.ex.ok ? r.ex.data : [];
  const lastSync = wfs.length || !r.wf.ok ? execs.map((e) => e.synced_at).filter(Boolean).sort().pop() : null;
  const url = st?.n8n_url ? String(st.n8n_url) : "";
  const urlHtml = !url ? "" : /^https?:\/\//i.test(url)
    ? `<a href="${esc(url)}" target="_blank" rel="noopener" title="Ouvrir n8n dans un nouvel onglet">${esc(url.replace(/^https?:\/\//i, "").replace(/\/$/, ""))}</a>`
    : esc(url);
  $("#ops-sub", el).innerHTML = lastSync ? `Dernière synchro ${when(lastSync)}${urlHtml ? ` · ${urlHtml}` : ""} · automatique toutes les 5 min`
    : st?.n8n && urlHtml ? `n8n branché · ${urlHtml}${r.wf.ok ? " · pas encore synchronisé" : ""}`
    : esc(OPS_SUB_DEFAULT);
}

function opsBanner(el, r) {
  const box = $("#ops-config", el);
  const code = (k) => `<code class="copy" data-copy="${k}" tabindex="0" role="button" title="Copier ${k}">${k}</code>`;
  let html = "";
  if (!r.st.ok) html = `<p class="hint" role="status">${lamp("off")} Configuration n8n non vérifiée (${esc(r.st.error?.message || "erreur inconnue")}). La synchro peut quand même fonctionner.</p>`;
  else if (r.st.data && !r.st.data.n8n) html = `<div class="banner warn" role="status"><div class="t"><b>n8n n'est pas encore branché</b>
      <ol><li>Dans Supabase → Edge Functions → Secrets, ajoute ${code("N8N_BASE_URL")} = l'URL de ton n8n, sans <code>/api</code> (ex. <code>https://n8n.tondomaine.com</code>), et ${code("N8N_API_KEY")} = n8n → Settings → n8n API → Create an API key.</li>
      <li>Rien à redéployer : clique « Synchroniser maintenant », les workflows et leurs exécutions arrivent tout de suite.</li></ol>
      <div class="btn-row" style="margin-top:10px"><a class="btn sm" href="${esc(OPS_SECRETS_URL)}" target="_blank" rel="noopener">${icon("ext")}Ouvrir les secrets Supabase</a><span class="hint" style="margin:0">Pas à pas : README, étapes 2 « Secrets Supabase » et 6 « Ops n8n ».</span></div>
    </div></div>`;
  box.innerHTML = html;
  box.hidden = !html;
}

function opsKpis(el, r) {
  const box = $("#ops-kpis", el);
  if (!r.wf.ok && !r.hc.ok) { box.innerHTML = panel({ body: errBox(r.wf.error) }); return; }
  const list = [];
  if (r.wf.ok) {
    const wfs = r.wf.data || [];
    const active = wfs.filter((w) => w.active);
    const watched = active.filter((w) => w.watch);
    const failing = watched.filter((w) => isFailStatus(w.last_status));
    const runs = sum(watched, "runs_24h"), errs = sum(watched, "errors_24h");
    const running = sum(wfs, "running_now");
    const oldest = wfs.filter((w) => num(w.running_now) > 0).map((w) => w.running_since).filter(Boolean).sort()[0];
    const names = failing.map((w) => w.name).join(", ");
    const short = names.length > 80 ? names.slice(0, 79) + "…" : names;
    list.push(
      kpi({ label: "Workflows surveillés", value: fmt(watched.length), sub: wfs.length ? `${plural(active.length, "actif", "actifs")} au total` : "aucun workflow synchronisé" }),
      kpi({ label: "En échec", tone: failing.length ? "crit" : "", value: fmt(failing.length),
        sub: failing.length ? `<span title="${esc(names)}">${esc(short)}</span>` : watched.length ? `${lamp("ok")} Tout va bien` : "rien de surveillé" }),
      kpi({ label: "Exécutions 24 h", value: fmt(runs), title: `${fmtFull(runs)} exécutions des workflows surveillés`,
        sub: `${plural(errs, "échec", "échecs")} · ${runs ? fmtPct(1 - errs / runs) : "—"} de réussite` }),
      kpi({ label: "En cours", value: fmt(running),
        sub: running ? (oldest ? `plus ancienne lancée ${when(oldest)}` : "en cours maintenant") : "aucune en ce moment" }),
    );
  } else {
    ["Workflows surveillés", "En échec", "Exécutions 24 h", "En cours"].forEach((label) => list.push(kpi({ label, value: "—", sub: "lecture impossible" })));
  }
  if (r.hc.ok) {
    const en = (r.hc.data || []).filter((c) => c.enabled !== false);
    const ok = en.filter((c) => c.last_checked_at && c.last_ok).length;
    const down = en.filter((c) => c.last_checked_at && !c.last_ok).length;
    const wait = en.filter((c) => !c.last_checked_at).length;
    list.push(en.length
      ? kpi({ label: "Services", tone: down ? "crit" : "", value: `${fmt(ok)}<small> / ${fmt(en.length)}</small>`,
          sub: ["répondent", down ? `<span class="t-crit">${down} en panne</span>` : "", wait ? `${wait} en attente` : ""].filter(Boolean).join(" · ") })
      : kpi({ label: "Services", value: "—", sub: "aucun service : ajoute-le plus bas" }));
  } else list.push(kpi({ label: "Services", value: "—", sub: "lecture impossible" }));
  box.innerHTML = kpis(list);
}

function opsAlerts(el, r) {
  const box = $("#ops-alerts", el), meta = $("#ops-alerts-meta", el), pnl = $("#ops-alerts-panel", el);
  let open;
  if (!r.alerts.ok) {
    open = errBox(r.alerts.error);
    meta.textContent = "";
    pnl.classList.remove("crit", "warn");
  } else {
    const list = sortAlerts(r.alerts.data);
    const crit = list.filter((a) => a.severity === "crit").length;
    meta.textContent = list.length ? `${plural(list.length, "ouverte", "ouvertes")}${crit ? ` · ${plural(crit, "critique", "critiques")}` : ""}` : "aucune ouverte";
    pnl.classList.toggle("crit", crit > 0);
    pnl.classList.toggle("warn", !crit && list.length > 0);
    open = `<div class="alerts">${list.length ? list.map((a) => alertRow(a)).join("")
      : `<div class="alert"><span class="sev ok">${lamp("ok")}OK</span><div class="t"><div>Aucune alerte ouverte</div><div class="when">Workflows en échec, exécutions bloquées, retards, services en panne, pipeline et SEO s'affichent ici et partent sur Telegram.</div></div></div>`}</div>`;
  }
  let resolved = "";
  if (!r.resolved.ok) resolved = `<div class="section-title ops-sub-h">Résolues récemment</div>${errBox(r.resolved.error)}`;
  else if ((r.resolved.data || []).length) resolved = `<div class="section-title ops-sub-h">Résolues récemment</div><div class="alerts">${r.resolved.data.map((a) => alertRow(a, { resolvable: false })).join("")}</div>`;
  box.innerHTML = open + resolved;
}

/** Tableau des workflows (filtre + inactifs). load = appelé par un rechargement : ne pas écraser une saisie en cours. */
function opsDrawWf({ load = false } = {}) {
  const box = $("#ops-wf"); if (!box || !OpsState.loaded) return;
  const note = $("#ops-wf-note"), chipN = $("#ops-wf-inactive-n");
  if (load) {
    const ae = document.activeElement;
    if (ae && box.contains(ae) && ae.matches("input[data-exp]") && ae.value !== (ae.dataset.orig ?? "")) return;
  }
  if (OpsState.wfErr) {
    mountTable(box, { id: "ops-wf", cols: OPS_WF_COLS, rows: [], empty: errBox(OpsState.wfErr) });
    if (note) note.textContent = "";
    if (chipN) chipN.textContent = "";
    return;
  }
  const all = OpsState.wfs;
  const inactive = all.filter((w) => !w.active).length;
  if (chipN) chipN.textContent = inactive ? String(inactive) : "";
  const words = opsNorm(OpsState.q).split(/\s+/).filter(Boolean);
  const list = all.filter((w) => (OpsState.showInactive || w.active) && words.every((x) => opsNorm(`${w.name} ${opsTags(w).join(" ")}`).includes(x)));
  const st = OpsState.status;
  const empty = !all.length
    ? (st && !st.n8n
        ? emptyBox("Aucun workflow synchronisé", "Branche n8n d'abord : ajoute les deux secrets indiqués dans le bandeau ci-dessus, puis synchronise.")
        : emptyBox("Aucun workflow synchronisé", "Lance une première synchro : les workflows n8n et leurs exécutions arrivent en quelques secondes.", `<button class="btn primary" type="button" data-ops-sync>${icon("sync")}Synchroniser maintenant</button>`))
    : emptyBox("Aucun workflow ne correspond", `${OpsState.q.trim() ? `Rien pour « ${esc(OpsState.q.trim())} »` : "Tous les workflows sont inactifs"}${!OpsState.showInactive && inactive ? " parmi les actifs" : ""}.`, `<button class="btn" type="button" data-ops-clear>Tout afficher</button>`);
  mountTable(box, { id: "ops-wf", csvName: "workflows-n8n", rows: list, sort: { key: "state", dir: "asc" }, cols: OPS_WF_COLS, empty });
  if (note) note.textContent = all.length
    ? `${fmtFull(list.length)} affichés sur ${plural(all.length, "workflow", "workflows")}${!OpsState.showInactive && inactive ? ` · ${plural(inactive, "inactif masqué", "inactifs masqués")}` : ""} · tri par défaut : en échec d'abord. L'export CSV suit le filtre.`
    : "";
}

function opsServices(el, r) {
  const box = $("#ops-hc", el);
  if (!r.hc.ok) { mountTable(box, { id: "ops-hc", cols: OPS_HC_COLS, rows: [], empty: errBox(r.hc.error) }); return; }
  mountTable(box, {
    id: "ops-hc", csvName: "services", rows: r.hc.data || [], cols: OPS_HC_COLS, sort: { key: "state", dir: "asc" },
    empty: emptyBox("Aucun service surveillé", "Ajoute le /health du pod RunPod, le renderer VDS (:8110), n8n, tes blogs : formulaire ci-dessous.", `<button class="btn" type="button" data-ops-focus="ops-hc-name">${icon("plus")}Ajouter un service</button>`),
  });
}

/** Calendrier : résumé des exécutions du jour / de la période choisi(e), par workflow. */
function opsPeriod(el, r, P) {
  const box = $("#ops-period", el), h2 = $("#ops-ex", el)?.closest(".panel")?.querySelector(".panel-h h2");
  if (h2) h2.textContent = P.custom ? `Exécutions · ${P.short}` : "Dernières exécutions";
  if (!P.custom) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  if (!r.ex.ok) { box.innerHTML = panel({ title: `n8n · ${P.label}`, body: errBox(r.ex.error) }); return; }
  const ex = r.ex.data || [], names = new Map(OpsState.wfs.map((w) => [String(w.id), w.name]));
  const isOk = (s) => s === "success", isKo = (s) => isFailStatus(s);
  const by = new Map();
  ex.forEach((e) => { const k = String(e.workflow_id); const o = by.get(k) || { id: k, name: names.get(k) || k, runs: 0, ok: 0, ko: 0, dur: [], first: null, last: null }; o.runs++; if (isOk(e.status)) o.ok++; if (isKo(e.status)) o.ko++;
    if (e.started_at && e.stopped_at) o.dur.push((new Date(e.stopped_at) - new Date(e.started_at)) / 1000); if (!o.first || e.started_at < o.first) o.first = e.started_at; if (!o.last || e.started_at > o.last) o.last = e.started_at; by.set(k, o); });
  const list = [...by.values()], ko = sum(list, "ko");
  box.innerHTML = panel({ title: `n8n · ${P.label}`, meta: `${fmtFull(ex.length)} exécution(s)${ex.length >= 1000 ? " (1 000 max)" : ""} · gardées 60 jours`, flush: true,
    body: `<div style="padding:12px 14px 0">${kpis([
      kpi({ label: "Exécutions", value: fmt(ex.length), sub: P.single ? "ce jour-là" : `${fmtDec(ex.length / P.d)} / jour` }),
      kpi({ label: "Succès", value: fmt(sum(list, "ok")), sub: ex.length ? pct(sum(list, "ok"), ex.length) : "" }),
      kpi({ label: "Échecs", value: fmt(ko), tone: ko ? "crit" : "", sub: ko ? list.filter((x) => x.ko).map((x) => x.name).slice(0, 3).join(", ") : "aucun" }),
      kpi({ label: "Workflows actifs", value: fmt(list.length), sub: "ont tourné sur la période" }),
    ])}</div><div id="ops-period-tbl"></div>` });
  mountTable($("#ops-period-tbl", el), { id: "ops-period-tbl", rows: list, sort: { key: "runs", dir: "desc" }, csvName: `n8n-${P.from}-${P.to}`,
    empty: emptyBox("Aucune exécution sur cette période", ex.length ? "" : "Les exécutions sont gardées 60 jours ; n8n était peut-être injoignable."),
    cols: [
      { key: "name", label: "Workflow", render: (x) => `<span class="cell-main">${esc(x.name)}</span>` },
      { key: "runs", label: "Exécutions", r: 1, num: 1, render: (x) => fmtFull(x.runs) },
      { key: "ok", label: "Succès", r: 1, num: 1, render: (x) => fmtFull(x.ok) },

/* ─── Actions ─── */
/** Après une écriture : vider le cache, repeindre les feux, relire la vue sans squelette. */
function opsAfterWrite(...keys) { Store.drop(...keys); Health.load(true); if (Router.view === "ops") Router.render({ silent: true }); }

/** ops-sync run : lecture idempotente, pas de confirmation. HTTP 200 même si n8n échoue (n8n_error). */
async function opsSync(btn) {
  const head = $("#ops-sync");
  if (OpsState.syncing) return;
  OpsState.syncing = true;
  const label = head ? $("span", head) : null;
  if (label) label.textContent = "Synchro en cours";
  busy(head, true);
  const keys = ["workflow_health", "alerts_open", "alerts_resolved", "health_checks", "ops_status"];
  let refreshed = false;
  try {
    await act(btn || head, {
      run: () => fn("ops-sync", { action: "run" }),
      bad: (r) => !r || !!r.n8n_error || !r.n8n,
      fail: (r) => (!r ? "Synchro : réponse vide de ops-sync"
        : r.n8n_error ? `n8n : ${r.n8n_error}`
        : `n8n n'est pas configuré${r.health ? ` · ${fmtFull(num(r.health.checked))} services vérifiés` : ""}`),
      ok: (r) => `Synchro OK · ${fmtFull(num(r.n8n?.executions))} exécutions, ${fmtFull(num(r.health?.checked))} services vérifiés${num(r.health?.down) ? `, ${fmtFull(num(r.health.down))} en panne` : ""}`,
      after: () => { refreshed = true; opsAfterWrite(...keys); },
    });
  } finally {
    busy(head, false);
    OpsState.syncing = false;
    if (label) label.textContent = "Synchroniser maintenant";
    /* Appel en échec (délai, réseau) : la synchro a pu avancer côté serveur, on relit quand même. */
    if (!refreshed && App.on) opsAfterWrite(...keys);
  }
}

/** Interrupteur « Surveiller » : confirmation, puis on remet l'ancienne valeur si annulé ou refusé. */
async function opsSetWatch(input) {
  const id = input.dataset.watch, w = OpsState.byId.get(id), name = w?.name || id, next = input.checked;
  OpsState.pending++;
  try {
    const r = await act(input, {
      confirm: next
        ? { title: "Surveiller", ok: "Surveiller",
            body: `<p>Surveiller <b>${esc(name)}</b> ?</p><p class="hint">Alerte, avec message Telegram, si sa dernière exécution échoue, si une exécution reste bloquée ou si aucun succès n'arrive dans le délai « Attendu ».${w && !w.active ? " Ce workflow est inactif dans n8n : rien ne partira tant qu'il le reste." : ""}</p>` }
        : { title: "Couper la surveillance", ok: "Couper",
            body: `<p>Couper la surveillance de <b>${esc(name)}</b> ?</p><p class="hint">Ses alertes seront résolues au prochain passage (5 min) et plus aucune ne partira pour ce workflow.</p>` },
      run: async () => { await write(sb.from("n8n_workflows").update({ watch: next }).eq("id", id), "surveillance"); return true; },
      ok: () => (next ? `${name} : surveillé` : `${name} : surveillance coupée`),
      after: () => opsAfterWrite("workflow_health"),
    });
    if (r == null) input.checked = !next;
  } finally { OpsState.pending--; }
}

/** Champ « Attendu (min) » : vide = null, sinon entier > 0. Valeur d'origine remise si invalide, annulé ou refusé. */
async function opsSetExpected(input) {
  if (input._opsBusy || !input.isConnected) return;
  const id = input.dataset.exp, w = OpsState.byId.get(id), name = w?.name || id;
  const orig = input.dataset.orig ?? "";
  const raw = input.value.trim();
  const revert = () => { input.value = orig; };
  if (!input.validity?.badInput && raw === orig) return;
  let v = null;
  if (input.validity?.badInput || raw !== "") {
    const n = Number(raw);
    if (input.validity?.badInput || !/^\d+$/.test(raw) || !Number.isSafeInteger(n) || n <= 0 || n > 2147483647) {
      toast("Attendu : un nombre entier de minutes supérieur à 0 (ex. 120), ou vide pour ne pas contrôler.", { err: true });
      revert();
      return;
    }
    v = n;
  }
  if (v === (orig === "" ? null : Number(orig))) { revert(); return; }
  const unwatched = w && (!w.watch || !w.active) ? ` <span class="t-warn">${!w.active ? "Ce workflow est inactif" : "La surveillance est coupée"} : aucune alerte ne partira pour l'instant.</span>` : "";
  /* Garde posée avant le premier await : la fermeture du dialogue rend le focus au champ,
     son blur suivant ne doit pas rouvrir une deuxième confirmation. */
  input._opsBusy = true;
  OpsState.pending++;
  try {
    const r = await act(input, {
      confirm: v == null
        ? { title: "Retirer le délai", ok: "Retirer le délai",
            body: `<p>Ne plus contrôler le délai entre deux succès de <b>${esc(name)}</b> ?</p><p class="hint">L'alerte « Workflow silencieux » ne partira plus pour ce workflow.</p>` }
        : { title: "Délai attendu", ok: "Enregistrer",
            body: `<p>Attendre un succès toutes les <b>${esc(opsMin(v))}</b> pour <b>${esc(name)}</b> ?</p><p class="hint">Alerte si aucun succès depuis ${esc(opsMin(2 * v))}.${unwatched}</p>` },
      run: async () => { await write(sb.from("n8n_workflows").update({ expected_every_min: v }).eq("id", id), "délai attendu"); return true; },
      ok: () => (v == null ? `${name} : délai retiré` : `${name} : un succès attendu toutes les ${fmtFull(v)} min`),
      after: () => opsAfterWrite("workflow_health"),
    });
    /* Succès : la nouvelle valeur devient la référence, sinon le rechargement croirait à une saisie en cours. */
    if (r == null) revert(); else input.dataset.orig = v == null ? "" : String(v);
  } finally { input._opsBusy = false; OpsState.pending--; }
}

/** Ajout d'un service : nom, URL http(s), code HTTP 100-599 (200 par défaut). */
async function opsAddCheck(form) {
  const nameI = $("#ops-hc-name", form), urlI = $("#ops-hc-url", form), codeI = $("#ops-hc-status", form), btn = $("button[type=submit]", form);
  const name = nameI.value.trim(), url = urlI.value.trim(), rawCode = codeI.value.trim();
  const bad = (msg, input) => { toast(msg, { err: true }); input.focus(); };
  if (!name) return bad("Indique un nom pour ce service (ex. GPU RunPod).", nameI);
  let okUrl = /^https?:\/\/\S+$/i.test(url);
  if (okUrl) { try { const u = new URL(url); okUrl = /^https?:$/.test(u.protocol) && !!u.hostname; } catch (_) { okUrl = false; } }
  if (!okUrl) return bad("URL invalide : elle doit commencer par http:// ou https:// (ex. https://xxxx-8000.proxy.runpod.net/health).", urlI);
  let code = 200;
  if (codeI.validity?.badInput || rawCode !== "") {
    code = Number(rawCode);
    if (codeI.validity?.badInput || !/^\d+$/.test(rawCode) || code < 100 || code > 599) return bad("Code HTTP attendu : un entier entre 100 et 599 (200 en général).", codeI);
  }
  const dup = [...OpsState.hcById.values()].find((c) => String(c.url ?? "").trim() === url);
  await act(btn, {
    confirm: { title: "Ajouter un service", ok: "Ajouter",
      body: `<p>Surveiller <b>${esc(name)}</b> ?</p><p class="hint"><code>${esc(url)}</code></p><p class="hint">Un GET toutes les 5 min · OK si la réponse est exactement HTTP ${code}. Une panne lève une alerte critique et part sur Telegram.${dup ? ` <span class="t-warn">Cette URL est déjà surveillée par « ${esc(dup.name)} ».</span>` : ""}</p>` },
    run: async () => { await write(sb.from("health_checks").insert({ name, url, expect_status: code }), "service"); return true; },
    ok: () => "Service ajouté · vérifié à la prochaine synchro (5 min)",
    after: () => { form.reset(); codeI.value = "200"; opsAfterWrite("health_checks"); },
  });
}

/** Retrait d'un service : suppression, puis résolution de son alerte orpheline health:<id>. */
async function opsDelCheck(btn) {
  const id = btn.dataset.delHc, c = OpsState.hcById.get(id), name = c?.name || "Service";
  const fp = "health:" + id;
  const hasAlert = OpsState.alerts.some((a) => a.fingerprint === fp);
  await act(btn, {
    confirm: { title: "Retirer le service", ok: "Retirer", danger: true,
      body: `<p>Ne plus surveiller <b>${esc(name)}</b> ?</p>${c?.url ? `<p class="hint"><code>${esc(c.url)}</code></p>` : ""}<p class="hint">Il n'est plus vérifié et disparaît de la liste.${hasAlert ? " Son alerte ouverte sera résolue." : ""} Tu pourras le rajouter plus tard.</p>` },
    run: async () => {
      await write(sb.from("health_checks").delete().eq("id", id), "service");
      try {
        await write(sb.from("alerts").update({ resolved_at: new Date().toISOString() }).eq("fingerprint", fp).is("resolved_at", null), "alerte du service");
        return { alertErr: null };
      } catch (e) { return { alertErr: e }; }
    },
    bad: (r) => !!r?.alertErr,
    fail: (r) => `${name} retiré, mais son alerte n'a pas pu être résolue (${r.alertErr.message}) : résous-la à la main.`,
    ok: () => `${name} retiré`,
    after: () => opsAfterWrite("health_checks", "alerts_open", "alerts_resolved"),
  });
}
